<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Perfil Coach · iTRAIN</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700;800&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f19;--panel:#111827;--panel2:#1f2937;--border:rgba(255,255,255,0.08);--text:#e6edf3;--muted:#94a3b8;--lime:#c8f700;--orange:#ff7a00;--red:#ef4444;--blue:#3b82f6;--purple:#8b5cf6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui;background:radial-gradient(ellipse at top,#1a2540 0%,var(--bg) 60%);color:var(--text);min-height:100vh;padding:32px 20px}
.wrap{max-width:980px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;text-decoration:none;letter-spacing:0.05em;text-transform:uppercase;font-weight:700;margin-bottom:24px;transition:color .15s}
.back:hover{color:var(--lime)}
.profile{display:flex;align-items:center;gap:24px;margin-bottom:32px;flex-wrap:wrap;padding-bottom:24px;border-bottom:1px solid var(--border)}
.avatar{width:108px;height:108px;border-radius:50%;background:linear-gradient(135deg,var(--lime),#a5d400);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:46px;font-weight:800;color:#0a0f19;box-shadow:0 12px 30px -6px rgba(200,247,0,0.45);flex-shrink:0;text-transform:uppercase;position:relative}
.avatar::after{content:'';position:absolute;inset:-4px;border-radius:50%;background:linear-gradient(135deg,var(--lime),var(--orange),var(--purple));z-index:-1;opacity:0.6;filter:blur(12px)}
.handle{flex:1;min-width:220px}
.verified{display:inline-flex;align-items:center;gap:4px;background:rgba(200,247,0,0.1);color:var(--lime);padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px}
h1{font-family:'Oswald',sans-serif;font-size:clamp(28px,4vw,40px);font-weight:800;line-height:1.1;letter-spacing:-0.01em;margin-bottom:4px}
.slug{color:var(--muted);font-size:14px;font-weight:500;margin-bottom:14px}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat .n{font-family:'Oswald',sans-serif;font-weight:800;font-size:24px;color:var(--text);letter-spacing:-0.02em;line-height:1}
.stat .l{font-size:10.5px;color:var(--muted);letter-spacing:0.08em;font-weight:700;text-transform:uppercase;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.035),rgba(255,255,255,0.01));border:1px solid var(--border);border-radius:16px;padding:18px 20px;transition:all .22s;text-decoration:none;color:inherit;cursor:pointer;position:relative;overflow:hidden}
.card:hover{border-color:rgba(200,247,0,0.28);transform:translateY(-3px);background:rgba(255,255,255,0.06)}
.card.hot{border-color:rgba(255,122,0,0.4);background:linear-gradient(180deg,rgba(255,122,0,0.08),rgba(255,255,255,0.02))}
.card.hot::before{content:'🔥 HOT';position:absolute;top:12px;right:14px;background:linear-gradient(135deg,#ff7a00,#dc2626);color:#fff;font-size:9.5px;font-weight:900;padding:3px 8px;border-radius:999px;letter-spacing:0.05em}
.card-title{font-weight:800;font-size:15px;margin-bottom:6px;letter-spacing:-0.01em;line-height:1.3;padding-right:50px}
.sport-chip{display:inline-block;background:rgba(200,247,0,0.1);color:var(--lime);padding:2px 9px;border-radius:6px;font-size:10.5px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:12px}
.card-stats{display:flex;gap:18px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.05)}
.ms{display:flex;flex-direction:column;min-width:0}
.ms .v{font-family:'Oswald',sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.01em;line-height:1;color:var(--text)}
.ms.d .v{color:var(--orange)}
.ms .k{font-size:9.5px;color:var(--muted);letter-spacing:0.06em;font-weight:700;text-transform:uppercase;margin-top:2px}
.empty{text-align:center;padding:70px 20px;background:rgba(255,255,255,0.02);border:1px dashed var(--border);border-radius:16px;color:var(--muted)}
.empty h2{color:var(--text);font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;margin-bottom:8px}
.section-title{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.08em;font-weight:800;font-size:14px;color:var(--muted);margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
 <a href="/top-jugadas.html" class="back">← Top jugadas</a>
 <div id="content"></div>
</div>
<script>
(async () => {
 const slug = decodeURIComponent((window.location.pathname.match(/\/coach\/([^/]+)/)||[])[1] || new URLSearchParams(window.location.search).get('slug') || '');
 const content = document.getElementById('content');
 if (!slug) {
  content.innerHTML = '<div class="empty"><h2>Coach no especificado</h2>Usa /coach/tu-nombre para ver tu perfil.</div>';
  return;
 }
 try {
  const r = await fetch(window.location.origin + '/api/coaches/' + encodeURIComponent(slug));
  const d = await r.json();
  const initials = (d.coach_name||slug).split(/[\s-]+/).slice(0,2).map(s=>s[0]||'').join('').toUpperCase() || slug[0].toUpperCase();
  const stats = d.totals || {};
  let html = `
   <div class="profile">
    <div class="avatar">${initials}</div>
    <div class="handle">
     <div class="verified">⚡ Coach iTRAIN</div>
     <h1>${(d.coach_name||slug).replace(/</g,'&lt;')}</h1>
     <div class="slug">@${d.slug}</div>
     <div class="stats">
      <div class="stat"><div class="n">${stats.boards||0}</div><div class="l">Jugadas</div></div>
      <div class="stat"><div class="n">${(stats.views||0).toLocaleString('es')}</div><div class="l">Vistas</div></div>
      <div class="stat"><div class="n">${(stats.duplicates||0).toLocaleString('es')}</div><div class="l">Duplicadas</div></div>
     </div>
    </div>
   </div>`;
  if (!d.items || d.items.length === 0) {
   html += `<div class="empty"><h2>Aún no hay jugadas publicadas</h2>Al compartir una pizarra, escribe tu slug "${d.slug}" y aparecerá aquí automáticamente.</div>`;
  } else {
   html += '<div class="section-title">📋 Jugadas publicadas (' + d.items.length + ')</div><div class="grid">';
   for (const it of d.items) {
    const hot = it.duplicates >= 3 ? 'hot' : '';
    const title = (it.title || `Jugada ${it.share_id}`).replace(/</g,'&lt;');
    const sport = (it.sport || 'Deporte').replace(/</g,'&lt;');
    html += `<a class="card ${hot}" href="/api/s/${encodeURIComponent(it.share_id)}" target="_blank" rel="noopener">
     <div class="card-title">${title}</div>
     <span class="sport-chip">⚽ ${sport}</span>
     <div class="card-stats">
      <div class="ms d"><div class="v">${it.duplicates||0}</div><div class="k">Duplicadas</div></div>
      <div class="ms"><div class="v">${it.views||0}</div><div class="k">Vistas</div></div>
     </div>
    </a>`;
   }
   html += '</div>';
  }
  content.innerHTML = html;
 } catch(e) {
  console.error(e);
  content.innerHTML = '<div class="empty"><h2>Error al cargar perfil</h2>Inténtalo más tarde.</div>';
 }
})();
</script>
</body>
</html>
