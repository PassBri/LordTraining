 // ── PLAYER PHOTO UPLOAD ──
 uploadPlayerPhoto(elId, input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
   // Resize to small thumbnail
   const img = new Image();
   img.onload = () => {
    const c = document.createElement('canvas');
    const sz = 80;
    c.width = sz; c.height = sz;
    const ctx = c.getContext('2d');
    const min = Math.min(img.width, img.height);
    const sx = (img.width - min) / 2, sy = (img.height - min) / 2;
    ctx.drawImage(img, sx, sy, min, min, 0, 0, sz, sz);
    const dataUrl = c.toDataURL('image/jpeg', 0.7);
    this.setProp(elId, 'photo', dataUrl);
    this.updatePanel();
   };
   img.src = e.target.result;
  };
  reader.readAsDataURL(file);
 },

 // ── ROSTER / PLANTILLA ──
 renderRoster() {
  const pc = document.getElementById('panel-content');
  const players = ST.elements.filter(e => e.type==='playerA'||e.type==='playerB'||e.type==='goalkeeper');
  const teamA = players.filter(p => p.type==='playerA'||p.type==='goalkeeper');
  const teamB = players.filter(p => p.type==='playerB');
  const subs = ST.substitutions || [];

  let html = '';
  // Team A
  html += `<div style="margin-bottom:12px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:${ST.teamAColor}">Equipo A (${teamA.length})</span><button style="font-size:9px;padding:2px 8px;border-radius:4px;background:${ST.teamAColor};color:#fff;font-weight:600" onclick="S.addQuickPlayer('playerA')">+ Jugador</button></div>`;
  if(teamA.length === 0) html += `<div style="text-align:center;padding:12px;color:#94a3b8;font-size:10px">Sin jugadores</div>`;
  teamA.forEach(p => {
   html += this.buildRosterCard(p);
  });
  html += `</div>`;

  // Team B
  html += `<div style="margin-bottom:12px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:${ST.teamBColor}">Equipo B (${teamB.length})</span><button style="font-size:9px;padding:2px 8px;border-radius:4px;background:${ST.teamBColor};color:#fff;font-weight:600" onclick="S.addQuickPlayer('playerB')">+ Jugador</button></div>`;
  if(teamB.length === 0) html += `<div style="text-align:center;padding:12px;color:#94a3b8;font-size:10px">Sin jugadores</div>`;
  teamB.forEach(p => {
   html += this.buildRosterCard(p);
  });
  html += `</div>`;

  // Substitutions section
  html += `<div style="border-top:1px solid var(--border);padding-top:8px;margin-top:4px">`;
  html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted)">Cambios / Sustituciones</span><button style="font-size:9px;padding:2px 8px;border-radius:4px;background:var(--primary);color:#fff;font-weight:600" onclick="S.addSubstitution()">+ Cambio</button></div>`;
  if(subs.length === 0) html += `<div style="text-align:center;padding:8px;color:#94a3b8;font-size:10px">Sin cambios registrados</div>`;
  subs.forEach((sub, idx) => {
   const playerOut = players.find(p => p.id === sub.outId);
   const playerIn = sub.inName || 'Suplente';
   html += `<div style="display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;background:#fef2f2;border:1px solid #fecaca;margin-bottom:3px;font-size:10px">`;
   html += `<span style="color:#ef4444;font-weight:700">↓</span>`;
   html += `<span style="flex:1;color:#991b1b">${playerOut?.name||playerOut?.label||'#'+sub.outId}</span>`;
   html += `<span style="color:#16a34a;font-weight:700">↑</span>`;
   html += `<input value="${playerIn}" onchange="S.updateSub(${idx},'inName',this.value)" style="flex:1;height:20px;font-size:10px;border:1px solid #d1d5db;border-radius:3px;padding:0 4px">`;
   html += `<input value="${sub.minute||''}" onchange="S.updateSub(${idx},'minute',this.value)" style="width:30px;height:20px;font-size:10px;border:1px solid #d1d5db;border-radius:3px;padding:0 3px;text-align:center" placeholder="min">`;
   html += `<button onclick="S.removeSub(${idx})" style="color:#f44;font-size:11px;font-weight:700;width:16px;height:16px;display:flex;align-items:center;justify-content:center">✕</button>`;
   html += `</div>`;
  });
  html += `</div>`;

  pc.innerHTML = html;
 },

 buildRosterCard(p) {
  const c = p.color || (p.type==='goalkeeper'?'#EF9F27':ST.teamAColor);
  const isGK = p.type === 'goalkeeper';
  let card = `<div style="display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:8px;background:#fff;border:1px solid var(--border);margin-bottom:3px;cursor:pointer;transition:all .12s" onclick="S.selectEl(${p.id})" onmouseenter="this.style.borderColor='${c}'" onmouseleave="this.style.borderColor='var(--border)'">`;
  // Photo or number
  if(p.photo) {
   card += `<img src="${p.photo}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid ${c};flex-shrink:0">`;
  } else {
   card += `<div style="width:28px;height:28px;border-radius:50%;background:${c}22;border:2px solid ${c};display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:800;color:${c}">${p.label||''}</div>`;
  }
  // Info
  card += `<div style="flex:1;min-width:0">`;
  card += `<div style="font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name||'Sin nombre'} <span style="color:${c};font-weight:800">#${p.label||''}</span></div>`;
  card += `<div style="font-size:9px;color:var(--text-muted)">${isGK?'Portero':p.position||'Sin posición'}</div>`;
  card += `</div>`;
  // Quick photo upload
  card += `<label style="cursor:pointer;flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--hover);display:flex;align-items:center;justify-content:center" title="Subir foto"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 1v10M1 6h10"/></svg><input type="file" accept="image/*" style="display:none" onchange="S.uploadPlayerPhoto(${p.id},this);S.renderRoster()"></label>`;
  card += `</div>`;
  return card;
 },

 addQuickPlayer(type) {
  const cx = 300 + Math.random()*200 - 100;
  const cy = type==='playerB' ? 200 + Math.random()*150 : 500 + Math.random()*150;
  this.addElement(type, cx, cy);
  this.renderRoster();
 },

 addSubstitution() {
  if(!ST.substitutions) ST.substitutions = [];
  const players = ST.elements.filter(e => e.type==='playerA'||e.type==='playerB'||e.type==='goalkeeper');
  ST.substitutions.push({ outId: players[0]?.id || 0, inName: '', minute: '' });
  this.renderRoster();
 },

 updateSub(idx, key, val) {
  if(!ST.substitutions) return;
  ST.substitutions[idx][key] = val;
  this.renderRoster();
 },

 removeSub(idx) {
  if(!ST.substitutions) return;
  ST.substitutions.splice(idx, 1);
  this.renderRoster();
 },

 switchTab(tab) {
  ST.panelTab = tab;
  document.getElementById('tab-elements').classList.toggle('active', tab==='elements');
  document.getElementById('tab-roster').classList.toggle('active', tab==='roster');
  document.getElementById('tab-gallery').classList.toggle('active', tab==='gallery');
  if(tab==='gallery') this.loadGallery();
  else if(tab==='roster') this.renderRoster();
  else this.updatePanel();
 },

 // ── GENERATE THUMBNAIL SVG ──
 generateThumbnail() {
  const f = FIELDS[ST.sport] || DEFAULT_FIELD;
  const tc = this.getFieldColors();
  let elsSvg = '';
  ST.elements.forEach(el => { elsSvg += this.buildElSvg(el); });
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" style="width:100%;height:100%;display:block">` +
   `<rect width="600" height="800" fill="${tc.bg}"/>` +
   `<defs><marker id="am" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="${tc.stroke}" stroke-width="1.5"/></marker></defs>` +
   `<g stroke="${tc.stroke}" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">${f.svg}</g>` +
   `<g>${elsSvg}</g></svg>`;
  return svg;
 },

 // ── SAVE MODAL ──
 showSaveModal() {
  const mc = document.getElementById('modal-card');
  const defaultName = ST.editingBoardId ? 'Actualizar Pizarra' : 'Nueva Pizarra';
  mc.innerHTML = `
   <h2>✓ Guardar Pizarra</h2>
   <div class="prop-group">

  document.getElementById('modal-overlay').classList.add('show');

 // ── SAVE TO SERVER ──
 async saveBoardToServer() {
  const nameInput = document.getElementById('save-name');
  const name = nameInput ? nameInput.value.trim() : ST.sport;
  if(!name) { this.showToast('Ingresa un nombre','error'); return; }
  const token = localStorage.getItem('train_token');
  if(!token) { this.showToast('Inicia sesion primero','error'); return; }
  const thumbnail = this.generateThumbnail();
  const body = {
   name: name,
   sport: ST.sport,
   sportName: ST.sport,
   category: ST.cat,
   elements: JSON.parse(JSON.stringify(ST.elements)),
   thumbnail: btoa(unescape(encodeURIComponent(thumbnail)))
  };
  try {
   const url = ST.editingBoardId ? `/api/tactical-boards/${ST.editingBoardId}` : '/api/tactical-boards';
   const method = ST.editingBoardId ? 'PUT' : 'POST';
   const res = await fetch(url, {
    method, headers: {'Content-Type':'application/json','Authorization':`Bearer ${token}`},
    body: JSON.stringify(body)
   });
   if(!res.ok) throw new Error('Error al guardar');
   document.getElementById('modal-overlay').classList.remove('show');
   this.showToast(ST.editingBoardId?'Pizarra actualizada':'Pizarra guardada','success');
   if(!ST.editingBoardId) {
    const data = await res.json();
    ST.editingBoardId = data.id;
   }
   // Notify opener (SessionEditor) if opened from there
   if(window.opener && !window.opener.closed) {
    window.opener.postMessage({type:'tactical-board-saved', boardId:ST.editingBoardId, sport:ST.sport, name:name, thumbnail:thumbnail, elements:ST.elements},'*');
   }
   // Notify other tabs (Herramientas gallery) via BroadcastChannel
   try { new BroadcastChannel('tactical-board').postMessage({type:'tactical-board-saved'}); } catch(e){}
   this.loadGallery();
  } catch(e) {
   this.showToast('Error al guardar: '+e.message,'error');
  }
 },

 // ── LOAD GALLERY ──
 async loadGallery() {
  const pc = document.getElementById('panel-content');
  const token = localStorage.getItem('train_token');
  if(!token) {
   pc.innerHTML = '<div class="gallery-empty">Inicia sesion para ver tus pizarras guardadas</div>';
   return;
  }
  pc.innerHTML = '<div class="gallery-empty">Cargando...</div>';
  try {
   const res = await fetch('/api/tactical-boards', {
    headers: {'Authorization':`Bearer ${token}`}
   });
   if(!res.ok) throw new Error('Error');
   ST.gallery = await res.json();
   this.renderGallery();
  } catch(e) {
   pc.innerHTML = '<div class="gallery-empty">Error al cargar galeria</div>';
  }
 },

 // ── RENDER GALLERY ──
 renderGallery() {
  const pc = document.getElementById('panel-content');
  if(ST.gallery.length===0) {
   pc.innerHTML = '<div class="gallery-empty">Sin pizarras guardadas.<br>Usa el boton ✓ Guardar para crear una.</div>';
   return;
  }
  let html = '';
  ST.gallery.forEach(b => {
   const isActive = ST.editingBoardId === b.id;
   const thumbSvg = b.thumbnail ? decodeURIComponent(escape(atob(b.thumbnail))) : '';
   const date = b.updated_at ? new Date(b.updated_at).toLocaleDateString('es') : '';
   html += `<div class="gallery-item${isActive?' selected':''}" data-testid="gallery-item-${b.id}">
    <div class="gallery-thumb">${thumbSvg}</div>
    <div class="gallery-name">${b.name||'Sin nombre'}</div>
    <div class="gallery-meta"><span>${b.sportName||b.sport||''}</span><span>${date}</span></div>
    <div class="gallery-actions">
     <button class="gallery-btn" onclick="S.loadBoard('${b.id}')">Cargar</button>
     <button class="gallery-btn del" onclick="event.stopPropagation();S.deleteBoard('${b.id}')">Eliminar</button>
    </div>
   </div>`;
  });
  pc.innerHTML = html;
 },

 // ── LOAD BOARD ──
 async loadBoard(id) {
  const token = localStorage.getItem('train_token');
  if(!token) return;
  try {
   const res = await fetch(`/api/tactical-boards/${id}`, {
    headers: {'Authorization':`Bearer ${token}`}
   });
   if(!res.ok) throw new Error('Error');
   const board = await res.json();
   // Set sport without clearing (we'll replace elements)
   ST.sport = board.sport || board.sportName || ST.sport;
   ST.cat = board.category || ST.cat;
   const f = FIELDS[ST.sport] || DEFAULT_FIELD;
   const tc = this.getFieldColors();
   const fl = document.getElementById('field-layer');
   fl.innerHTML = `<rect x="0" y="0" width="600" height="800" fill="${tc.bg}" rx="0"/>` +
    `<g stroke="${tc.stroke}" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">${f.svg}</g>`;
   // Restore elements
   ST.elements = board.elements || [];
   ST.nextId = ST.elements.reduce((max,el)=>Math.max(max,(el.id||0)+1),1);
   ST.selected = [];
   ST.editingBoardId = id;
   this.saveHistory();
   this.renderElements();
   this.renderTabs();
   this.updatePanel();
   this.updateStats();
   this.showToast('Pizarra cargada','success');
   this.switchTab('elements');
  } catch(e) {
   this.showToast('Error al cargar pizarra','error');
  }
 },

 // ── DELETE BOARD ──
 async deleteBoard(id) {
  if(!confirm('¿Eliminar esta pizarra?')) return;
  const token = localStorage.getItem('train_token');
  if(!token) return;
  try {
   const res = await fetch(`/api/tactical-boards/${id}`, {
    method:'DELETE', headers: {'Authorization':`Bearer ${token}`}
   });
   if(!res.ok) throw new Error('Error');
   if(ST.editingBoardId===id) ST.editingBoardId=null;
   this.showToast('Pizarra eliminada','success');
   this.loadGallery();
  } catch(e) {
   this.showToast('Error al eliminar','error');
  }
 }
};
