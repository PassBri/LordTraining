 },

 // ── CANVAS EVENTS ──
 bindCanvas() {
  const svg = document.getElementById('svg-canvas');
  const getPoint = (e) => {
   const pt = svg.createSVGPoint();
   pt.x = e.clientX; pt.y = e.clientY;
   const ctm = document.getElementById('zoom-group').getScreenCTM();
   if(!ctm) return {x:400,y:300};
   return pt.matrixTransform(ctm.inverse());
  };

  svg.addEventListener('mousedown', e => {
   if(e.button===2) return;
   const p = getPoint(e);
   const target = e.target.closest('[data-id]');

   if(ST.spaceDown) { ST.panning = true; ST.dragStart = {x:e.clientX,y:e.clientY}; return; }

   if(ST.tool==='move') {
    if(target) {
     const id = target.dataset.id;
     const el = ST.elements.find(x=>x.id==id);
     if(!el) return;
     if(!e.shiftKey) ST.selected = [];
     if(!ST.selected.includes(el)) ST.selected.push(el);
     ST.dragging = 'move';
     ST.dragStart = p;
     ST.dragOffset = ST.selected.map(s=>({id:s.id,ox:s.x,oy:s.y}));
     this.updatePanel();
     this.renderElements();
    } else {
     ST.selected = [];
     ST.selRect = {x:p.x,y:p.y,w:0,h:0};
     this.updatePanel();
     this.renderElements();
    }
   } else if(ST.tool==='eraser') {
    if(target) {
     const id = target.dataset.id;
     ST.elements = ST.elements.filter(x=>x.id!=id);
     ST.selected = [];
     this.saveHistory();
     this.renderElements();
     this.updatePanel();
     this.updateStats();
    }
   } else if(ST.tool==='playerA'||ST.tool==='playerB'||ST.tool==='goalkeeper'||ST.tool==='ball'||ST.tool==='cone'||ST.tool==='flag'||ST.tool==='hurdle'||ST.tool==='disc'||ST.tool==='minigoal'||ST.tool==='mannequin'||ST.tool==='vest'||ST.tool==='ring'||ST.tool==='ladder'||ST.tool==='pole'||ST.tool==='plyobox'||ST.tool==='kettlebell'||ST.tool==='medball'||ST.tool==='trx'||ST.tool==='sled'||ST.tool==='parachute'||ST.tool==='rope'||ST.tool==='battlerope'||ST.tool==='roller'||ST.tool==='band'||ST.tool==='bosu'||ST.tool==='mat'||ST.tool==='dumbbell'||ST.tool==='barbell'||ST.tool==='bench'||ST.tool==='rack'||ST.tool==='treadmill'||ST.tool==='bike'||ST.tool==='rower'||ST.tool==='pullup'||ST.tool==='pilatesball'||ST.tool==='stepper'||ST.tool.startsWith('gm_')||ST.tool.startsWith('sp_')||ST.tool.startsWith('p_')) {
    this.addElement(ST.tool, p.x, p.y);
   } else if(ST.tool==='arrow'||ST.tool==='line') {
    ST.drawing = {type:ST.tool,x1:p.x,y1:p.y,x2:p.x,y2:p.y};
   } else if(ST.tool==='zone') {
    ST.drawing = {type:'zone',x:p.x,y:p.y,w:0,h:0};
   } else if(ST.tool==='text') {
    // Inline text input
    this.startInlineText(p.x, p.y, e);
   } else if(ST.tool==='pencil') {
    ST.drawing = {type:'pencil',points:[{x:p.x,y:p.y}]};
   } else if(ST.tool==='curve') {
    if(ST.drawing && ST.drawing.type==='curve' && ST.drawing.phase===2) {
     // Phase 2: set control point and finalize
     ST.drawing.cx = p.x; ST.drawing.cy = p.y;
     this.addElement('curve',0,0,{x1:ST.drawing.x1,y1:ST.drawing.y1,cx:p.x,cy:p.y,x2:ST.drawing.x2,y2:ST.drawing.y2});
     ST.drawing = null;
     document.getElementById('handles-layer').innerHTML = '';
    } else {
     // Phase 1: start drawing - set start point
     ST.drawing = {type:'curve',x1:p.x,y1:p.y,cx:p.x,cy:p.y,x2:p.x,y2:p.y,phase:1};
    }
   }
  });

  svg.addEventListener('mousemove', e => {
   const p = getPoint(e);
   if(ST.panning && ST.dragStart) {
    const dx = (e.clientX - ST.dragStart.x)/ST.zoom;
    const dy = (e.clientY - ST.dragStart.y)/ST.zoom;
    ST.panX += dx; ST.panY += dy;
    ST.dragStart = {x:e.clientX,y:e.clientY};
    this.applyZoom();
    return;
   }
   if(ST.dragging==='move' && ST.dragOffset) {
    const dx = p.x - ST.dragStart.x;
    const dy = p.y - ST.dragStart.y;
    ST.dragOffset.forEach(o => {
     const el = ST.elements.find(x=>x.id===o.id);
     if(el) { el.x = o.ox + dx; el.y = o.oy + dy; }
    });
    this.renderElements();
   }
   if(ST.selRect) {
    ST.selRect.w = p.x - ST.selRect.x;
    ST.selRect.h = p.y - ST.selRect.y;
    const sl = document.getElementById('sel-rect-layer');
    const r = ST.selRect;
    const rx = r.w<0?r.x+r.w:r.x, ry = r.h<0?r.y+r.h:r.y;
    sl.innerHTML = `<rect x="${rx}" y="${ry}" width="${Math.abs(r.w)}" height="${Math.abs(r.h)}" class="sel-box"/>`;
   }
   if(ST.drawing) {
    if(ST.drawing.type==='arrow'||ST.drawing.type==='line') {
     ST.drawing.x2 = p.x; ST.drawing.y2 = p.y;
     this.renderDrawingPreview();
    } else if(ST.drawing.type==='zone') {
     ST.drawing.w = p.x - ST.drawing.x; ST.drawing.h = p.y - ST.drawing.y;
     this.renderDrawingPreview();
    } else if(ST.drawing.type==='pencil') {
     ST.drawing.points.push({x:p.x,y:p.y});
     this.renderDrawingPreview();
    } else if(ST.drawing.type==='curve') {
     if(ST.drawing.phase===1) { ST.drawing.x2 = p.x; ST.drawing.y2 = p.y; ST.drawing.cx = (ST.drawing.x1+p.x)/2; ST.drawing.cy = Math.min(ST.drawing.y1,p.y)-40; }
     else if(ST.drawing.phase===2) { ST.drawing.cx = p.x; ST.drawing.cy = p.y; }
     this.renderDrawingPreview();
    }
   }
  });

  const endDrag = () => {
   if(ST.panning) { ST.panning = false; ST.dragStart = null; return; }
   if(ST.dragging==='move') { ST.dragging = null; this.saveHistory(); }
   if(ST.selRect) {
    const r = ST.selRect;
    const rx = r.w<0?r.x+r.w:r.x, ry = r.h<0?r.y+r.h:r.y;
    const rw = Math.abs(r.w), rh = Math.abs(r.h);
    ST.selected = ST.elements.filter(el=>el.x>=rx&&el.x<=rx+rw&&el.y>=ry&&el.y<=ry+rh);
    ST.selRect = null;
    document.getElementById('sel-rect-layer').innerHTML = '';
    this.renderElements();
    this.updatePanel();
   }
   if(ST.drawing) {
    const d = ST.drawing;
    if(d.type==='arrow') this.addElement('arrow',0,0,{x1:d.x1,y1:d.y1,x2:d.x2,y2:d.y2});
    else if(d.type==='line') this.addElement('line',0,0,{x1:d.x1,y1:d.y1,x2:d.x2,y2:d.y2});
    else if(d.type==='zone') this.addElement('zone',d.x,d.y,{w:d.w,h:d.h});
    else if(d.type==='pencil'&&d.points.length>2) this.addElement('pencil',0,0,{points:d.points});
    else if(d.type==='curve') {
     if(d.phase===1) { d.phase=2; return; } // Transition to phase 2 - don't end
     this.addElement('curve',0,0,{x1:d.x1,y1:d.y1,cx:d.cx,cy:d.cy,x2:d.x2,y2:d.y2});
    }
    ST.drawing = null;
    document.getElementById('handles-layer').innerHTML = '';
   }
  };
  svg.addEventListener('mouseup', endDrag);
  svg.addEventListener('mouseleave', endDrag);

  // Zoom
  svg.addEventListener('wheel', e => {
   e.preventDefault();
   const delta = e.deltaY > 0 ? -0.1 : 0.1;
   ST.zoom = Math.max(0.3, Math.min(4, ST.zoom + delta));
   this.applyZoom();
  }, {passive:false});

  // Context menu
  svg.addEventListener('contextmenu', e => {
   e.preventDefault();
   const target = e.target.closest('[data-id]');
   if(target) {
    const id = target.dataset.id;
    const el = ST.elements.find(x=>x.id==id);
    if(el && !ST.selected.includes(el)) { ST.selected = [el]; this.renderElements(); }
   }
   this.showContextMenu(e.clientX, e.clientY);
  });
 },

 renderDrawingPreview() {
  const hl = document.getElementById('handles-layer');
  if(!ST.drawing) { hl.innerHTML=''; return; }
  const d = ST.drawing;
  if(d.type==='arrow') {
   hl.innerHTML = `<line x1="${d.x1}" y1="${d.y1}" x2="${d.x2}" y2="${d.y2}" stroke="rgba(0,0,0,0.5)" stroke-width="2" marker-end="url(#arrow-marker)" stroke-dasharray="4 3"/>`;
  } else if(d.type==='line') {
   hl.innerHTML = `<line x1="${d.x1}" y1="${d.y1}" x2="${d.x2}" y2="${d.y2}" stroke="rgba(0,0,0,0.5)" stroke-width="2" stroke-dasharray="4 3"/>`;
  } else if(d.type==='zone') {
   const zc = ST.zoneColor||'#378ADD';
   hl.innerHTML = `<rect x="${d.w<0?d.x+d.w:d.x}" y="${d.h<0?d.y+d.h:d.y}" width="${Math.abs(d.w)}" height="${Math.abs(d.h)}" fill="${zc}" fill-opacity="0.1" stroke="${zc}" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6 4" rx="8"/>`;
  } else if(d.type==='pencil') {
   hl.innerHTML = `<polyline points="${d.points.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="2"/>`;
  } else if(d.type==='curve') {
   hl.innerHTML = `<path d="M${d.x1},${d.y1} Q${d.cx},${d.cy} ${d.x2},${d.y2}" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="2" stroke-dasharray="4 3"/>`;
  }
 },

 // ── ELEMENTS ──
 addElement(type, x, y, extra={}) {
  const id = ST.nextId++;
  const el = {id, type, x, y, color: type==='playerA'?ST.teamAColor:type==='playerB'?ST.teamBColor:type==='goalkeeper'?'#EF9F27':'#334155', ...extra};
  if(type==='playerA'||type==='playerB'||type==='goalkeeper') {
   el.label = String(ST.elements.filter(e=>e.type===type).length + 1);
   el.size = 15;

  if(type==='cone') { el.color = ST.elementColors.cone||'#ff9800'; el.size = 1; }
  if(type==='disc') { el.color = ST.elementColors.disc||'#2563eb'; el.size = 1; }
  if(type==='ring') { el.color = ST.elementColors.ring||'#8b5cf6'; el.size = 1; }

  if(type==='rope') { el.color = ST.elementColors.rope || '#78716c'; el.size = 1; }
  if(type==='battlerope') { el.color = ST.elementColors.battlerope || '#1e293b'; el.size = 1; }

  // Staff roles (p_ prefix) - render like players but with role-specific colors
  if(type.startsWith('p_')) {
   const roleColors = {p_coach:'#1e40af',p_assistant:'#3b82f6',p_director:'#1e293b',p_physio:'#059669',p_kinesio:'#10b981',p_psycho:'#7c3aed',p_referee:'#111',p_linejudge:'#fbbf24',p_tablejudge:'#f59e0b',p_biomech:'#0891b2',p_nutri:'#16a34a'};
   el.color = ST.elementColors[type] || roleColors[type] || '#475569';
   el.size = 14; el.label = ST.elements.filter(e=>e.type===type).length;
  }
  if(type==='ball') { el.size = 8; el.ballType = ST.currentSport?.includes('Balon') ? (ST.currentSport.includes('cesto') ? 'basketball' : 'handball') : ST.currentSport?.includes('Volei') ? 'volleyball' : ST.currentSport?.includes('Rugby') ? 'rugby' : ST.currentSport?.includes('Tenis') ? 'tennis' : ST.currentSport?.includes('Beisbol') ? 'baseball' : ST.currentSport?.includes('Americ') ? 'football_us' : 'soccer'; }
  if(type==='zone') { el.zoneColor = ST.zoneColor||'#378ADD'; el.opacity = ST.zoneOpacity||0.12; el.borderOpacity = 0.45; el.label = ''; }

  if(type==='arrow') { el.playOrder = ST.elements.filter(e=>e.type==='arrow').length + 1; el.strokeWidth = 2.5; el.color = ST.lineColor||(ST.theme==='dark'?'#94a3b8':'#1e293b'); el.dash = ST.lineStyle==='dashed'?'6 4':ST.lineStyle==='dotted'?'2 3':''; }
  if(type==='line') { el.strokeWidth = 2; el.color = ST.lineColor||(ST.theme==='dark'?'#94a3b8':'#1e293b'); el.dash = ST.lineStyle==='dashed'?'6 4':ST.lineStyle==='dotted'?'2 3':''; }
  if(type==='curve') { el.color = ST.lineColor||(ST.theme==='dark'?'#94a3b8':'#1e293b'); el.dash = ST.lineStyle==='dashed'?'6 4':ST.lineStyle==='dotted'?'2 3':''; }
  ST.elements.push(el);
  this.saveHistory();
  this.renderElements();
  this.updatePanel();

 buildElSvg(el) {
  const sel = ST.selected.includes(el);
  const selStroke = sel ? `<circle cx="0" cy="0" r="${(el.size||15)+6}" fill="none" stroke="${el.color||'#2563eb'}" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6"/>` : '';
  // 3D perspective scale: elements higher up (smaller Y) are farther away
  const is3D = ST.viewMode==='3d'||ST.viewMode==='2.5d';
  const yPos = el.y || el.y1 || 400;
  // Scale from 0.55 (top, y=0) to 1.2 (bottom, y=800)
  const depthScale = is3D ? 0.55 + (yPos / 800) * 0.65 : 1;
  const depthOpacity = is3D ? 0.6 + (yPos / 800) * 0.4 : 1;
  switch(el.type) {
   case 'playerA': case 'playerB': case 'goalkeeper': {
    const r = el.size||15;
    const c = el.color;
    const lbl = el.label||'';
    const nm = el.name||'';
    const ds = depthScale;

    if(is3D) {
     // 3D mode: elements stand upright with counter-rotation
     const s = ds * 1.1;
     const shadowRx = 14*s, shadowRy = 5*s;
     const bodyH = ST.avatarMode==='avatar' ? 48*s : ST.avatarMode==='jersey' ? 36*s : 0;

     // Shadow on the ground
     const shadow = `<ellipse cx="0" cy="0" rx="${shadowRx}" ry="${shadowRy}" fill="rgba(0,0,0,0.25)" filter="url(#blur3d)"/>`;

     if(ST.avatarMode==='avatar') {
      return this.buildAvatar3D(el, c, lbl, nm, s, shadow);

     } else if(ST.avatarMode==='jersey') {
      const js = 1.3*s;
      const photoHead3d = el.photo ? `<defs><clipPath id="jc3d${el.id}"><circle cx="0" cy="${-22*js}" r="${6*js}"/></clipPath></defs><image href="${el.photo}" x="${-6*js}" y="${-28*js}" width="${12*js}" height="${12*js}" clip-path="url(#jc3d${el.id})" preserveAspectRatio="xMidYMid slice"/><circle cx="0" cy="${-22*js}" r="${6*js}" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>` : '';
      return `<g transform="translate(${el.x},${el.y})" data-id="${el.id}" style="cursor:grab">${shadow}<g transform="translate(0,${-18*js})">
       <path d="M${-10*js},${-14*js} L${-6*js},${-18*js} L0,${-16*js} L${6*js},${-18*js} L${10*js},${-14*js} L${12*js},${-6*js} L${8*js},${-4*js} L${8*js},${12*js} L${-8*js},${12*js} L${-8*js},${-4*js} L${-12*js},${-6*js} Z" fill="${c}" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
       <path d="M0,${-16*js} L${6*js},${-18*js} L${10*js},${-14*js} L${12*js},${-6*js} L${8*js},${-4*js} L${8*js},${12*js} L0,${12*js} Z" fill="rgba(0,0,0,0.08)"/>
       <text x="0" y="${2*js}" text-anchor="middle" font-size="${12*js}" fill="${this.contrastColor(c)}" font-weight="800">${lbl}</text>
       ${photoHead3d}
      </g>${nm?`<text x="0" y="${-40*js}" text-anchor="middle" font-size="11" fill="${c}" font-weight="800" stroke="#fff" stroke-width="3" paint-order="stroke">${nm}</text>`:''} ${el.position?`<text x="0" y="${18*js}" text-anchor="middle" font-size="9" fill="${c}" font-weight="700" stroke="#fff" stroke-width="2" paint-order="stroke">${el.position}</text>`:''}</g>`;

     } else {
      // Tactical 3D with photo support
      const rs = r*s;
      const photoSphere = el.photo ? `<defs><clipPath id="tc3d${el.id}"><circle cx="0" cy="0" r="${rs}"/></clipPath></defs><image href="${el.photo}" x="${-rs}" y="${-rs}" width="${rs*2}" height="${rs*2}" clip-path="url(#tc3d${el.id})" preserveAspectRatio="xMidYMid slice"/><circle cx="0" cy="0" r="${rs}" fill="none" stroke="${c}" stroke-width="2"/>` :
       `<circle cx="0" cy="0" r="${rs}" fill="${c}"/><circle cx="${-rs*0.25}" cy="${-rs*0.25}" r="${rs*0.45}" fill="rgba(255,255,255,0.2)"/><circle cx="${rs*0.15}" cy="${rs*0.2}" r="${rs*0.3}" fill="rgba(0,0,0,0.1)"/><text x="0" y="0" dy="0.35em" text-anchor="middle" font-size="${rs*0.85}" fill="${this.contrastColor(c)}" font-weight="800">${lbl}</text>`;
      return `<g transform="translate(${el.x},${el.y})" data-id="${el.id}" style="cursor:grab">${shadow}<g transform="translate(0,${-rs})">${photoSphere}</g>${nm?`<text x="0" y="${-rs*2-4}" text-anchor="middle" font-size="11" fill="${c}" font-weight="800" stroke="#fff" stroke-width="3" paint-order="stroke">${nm}</text>`:''} ${el.position?`<text x="0" y="${rs+10}" text-anchor="middle" font-size="9" fill="${c}" font-weight="700" stroke="#fff" stroke-width="2" paint-order="stroke">${el.position}</text>`:''}</g>`;
     }
    } else {
     // 2D mode
     const shadow = `<ellipse cx="0" cy="${r+4}" rx="${r-2}" ry="3" fill="rgba(0,0,0,0.08)"/>`;
     if(ST.avatarMode==='jersey') {
      const pos = el.position||'';
      const photoHead = el.photo ? `<defs><clipPath id="jclip${el.id}"><circle cx="0" cy="-22" r="7"/></clipPath></defs><image href="${el.photo}" x="-7" y="-29" width="14" height="14" clip-path="url(#jclip${el.id})" preserveAspectRatio="xMidYMid slice"/><circle cx="0" cy="-22" r="7" fill="none" stroke="${c}" stroke-width="1"/>` : '';
      return `<g transform="translate(${el.x},${el.y})" data-id="${el.id}" style="cursor:grab">${selStroke}${shadow}<path d="M-10,-14 L-6,-18 L0,-16 L6,-18 L10,-14 L12,-6 L8,-4 L8,12 L-8,12 L-8,-4 L-12,-6 Z" fill="${c}" stroke="rgba(0,0,0,0.2)" stroke-width="1"/><text x="0" y="2" text-anchor="middle" font-size="11" fill="${this.contrastColor(c)}" font-weight="800">${lbl}</text>${photoHead}${nm?`<text x="0" y="${el.photo?'-32':'-22'}" text-anchor="middle" font-size="8" fill="${c}" font-weight="600">${nm}</text>`:''}${pos?`<text x="0" y="22" text-anchor="middle" font-size="7" fill="${c}" font-weight="500">${pos}</text>`:''}</g>`;
     } else if(ST.avatarMode==='avatar') {
      return this.buildAvatar2D(el, c, lbl, nm, r, selStroke, shadow);
     } else {
      // Tactical 2D: circle with optional photo

      ${nm?`<text x="0" y="${-r-4}" text-anchor="middle" font-size="8" fill="${c}" font-weight="700">${nm}</text>`:''}
      <text x="0" y="${r+8}" text-anchor="middle" font-size="6.5" fill="${c}" font-weight="600">${lbl}</text>
     </g>`;
    }
    if (el.type.startsWith('gm_') || el.type.startsWith('sp_')) {
     const es = el.size||1; const c = el.color||'#64748b'; const rot = el.rotation||0;
     const tool = TOOLS.find(t => t.id === el.type);
     const lbl = tool ? tool.label : el.type.replace('gm_','').replace(/_/g,' ');
     const iconSvg = tool ? tool.icon : '<rect x="3" y="3" width="12" height="12" rx="2" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1"/>';
     const isDark = ST.theme==='dark';
     const bgAlpha = isDark ? '28' : '1f';
     const labelBg = isDark ? 'rgba(10,15,31,0.85)' : 'rgba(255,255,255,0.92)';
     const lblLen = lbl.length;
     const lblW = Math.max(28, lblLen * 4.6);
     return `<g transform="translate(${el.x},${el.y}) scale(${es})${rot?` rotate(${rot})`:''}" data-id="${el.id}" style="cursor:grab">
      <rect x="-20" y="-18" width="40" height="36" rx="7" fill="${c}" fill-opacity="0.14" stroke="${c}" stroke-width="1.4" filter="url(#shadow3d)"/>
      <rect x="-20" y="-18" width="40" height="36" rx="7" fill="none" stroke="${c}" stroke-width="0.5" opacity="0.4" transform="translate(0,0.5)"/>
      <svg viewBox="0 0 18 18" x="-11" y="-14" width="22" height="22" fill="none" stroke="${c}" style="color:${c}">${iconSvg}</svg>
      <rect x="${-lblW/2}" y="20" width="${lblW}" height="11" rx="3" fill="${labelBg}" stroke="${c}" stroke-width="0.5" opacity="0.95"/>
      <text x="0" y="28.5" text-anchor="middle" font-size="7.5" fill="${c}" font-weight="800" letter-spacing="0.02em">${lbl}</text>
     </g>`;
    }
    return '';
   }
  }
 },

 renderElements() {
  const layer = document.getElementById('elements-layer');
  const mStroke = ST.theme==='dark' ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.7)';
  let defs = `<defs>
   <marker id="arrow-marker" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="${mStroke}" stroke-width="1.5" stroke-linecap="round"/></marker>
   <filter id="blur3d"><feGaussianBlur stdDeviation="3"/></filter>
   <filter id="shadow3d"><feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.2"/></filter>
  </defs>`;

  if(ST.viewMode==='3d') {
   // Isometric mode: project and sort by iso Y (painter's algorithm)
   const projected = ST.elements.map(el => {
    const ey = el.y||el.y1||400;
    const ex = el.x||el.x1||300;
    const ip = this.toIso(ex, ey, 0);
    return {el, isoY: ip.y};
   });
   projected.sort((a,b) => a.isoY - b.isoY);
   layer.innerHTML = defs + projected.map(({el}) => this.buildIsoElement(el)).join('');
  } else {
   const zOrder = {zone:0, line:1, arrow:1, curve:1, pencil:1, cone:2, disc:2, flag:2, hurdle:2, minigoal:2, mannequin:2, vest:2, ring:2, ladder:2, pole:2, plyobox:2, kettlebell:2, medball:2, trx:2, sled:2, parachute:2, rope:2, battlerope:2, roller:2, band:2, bosu:2, mat:2, ball:2, playerA:3, playerB:3, goalkeeper:3, text:4};
   const sorted = [...ST.elements].sort((a,b)=>(zOrder[a.type]||2)-(zOrder[b.type]||2));
   layer.innerHTML = defs + sorted.map(el => this.buildElSvg(el)).join('');
  }
 },

 // ── ZOOM ──
 applyZoom() {
  const g = document.getElementById('zoom-group');
  let t = `translate(${ST.panX},${ST.panY}) scale(${ST.zoom})`;
  if(ST.fieldRotation) t += ` rotate(${ST.fieldRotation} 300 400)`;
  if(ST.fieldFlipH) t += ' translate(600,0) scale(-1,1)';
  if(ST.fieldFlipV) t += ' translate(0,800) scale(1,-1)';
  g.setAttribute('transform', t);
 },
 zoomIn() { ST.zoom = Math.min(4, ST.zoom + 0.2); this.applyZoom(); },
 zoomOut() { ST.zoom = Math.max(0.3, ST.zoom - 0.2); this.applyZoom(); },
 zoomReset() { ST.zoom = 1; ST.panX = 0; ST.panY = 0; this.applyZoom(); },

 // ── GRID ──
 toggleGrid() {
  ST.grid = !ST.grid;
  document.getElementById('btn-grid').classList.toggle('active', ST.grid);
  const gl = document.getElementById('grid-layer');
  if(ST.grid) {
   let lines = '';

   gl.innerHTML = lines;
  } else gl.innerHTML = '';
 },

 // ── HISTORY ──
 saveHistory() {
  const snap = JSON.stringify(ST.elements);
  ST.history = ST.history.slice(0, ST.historyIdx + 1);
  ST.history.push(snap);
  if(ST.history.length > ST.maxHistory) ST.history.shift();
  ST.historyIdx = ST.history.length - 1;
 },
 undo() {
  if(ST.historyIdx <= 0) return;
  ST.historyIdx--;
  ST.elements = JSON.parse(ST.history[ST.historyIdx]);
  ST.selected = [];
  this.renderElements(); this.updatePanel(); this.updateStats();
 },
 redo() {
  if(ST.historyIdx >= ST.history.length - 1) return;
  ST.historyIdx++;
  ST.elements = JSON.parse(ST.history[ST.historyIdx]);
  ST.selected = [];
  this.renderElements(); this.updatePanel(); this.updateStats();
 },

 clearAll() {
  if(!confirm('Limpiar todos los elementos?')) return;
  ST.elements = []; ST.selected = [];
  this.saveHistory(); this.renderElements(); this.updatePanel(); this.updateStats();
 },

 },

 selectEl(id) {
  const el = ST.elements.find(x=>x.id===id);
  if(el) { ST.selected = [el]; this.updatePanel(); this.renderElements(); }
 },

 deleteEl(id) {
  ST.elements = ST.elements.filter(x=>x.id!==id);
  ST.selected = ST.selected.filter(x=>x.id!==id);
  this.saveHistory(); this.renderElements(); this.updatePanel(); this.updateStats();
 },

 deleteSelected() {
  const ids = new Set(ST.selected.map(s=>s.id));
  ST.elements = ST.elements.filter(x=>!ids.has(x.id));
  ST.selected = [];
  this.saveHistory(); this.renderElements(); this.updatePanel(); this.updateStats();
 },

 updateStats() {
  const a = ST.elements.filter(e=>e.type==='playerA').length;
  const b = ST.elements.filter(e=>e.type==='playerB').length;
  const gk = ST.elements.filter(e=>e.type==='goalkeeper').length;
  const arr = ST.elements.filter(e=>e.type==='arrow').length;
  const parts = [];
  if(a) parts.push(`${a} Eq.A`);
  if(b) parts.push(`${b} Eq.B`);
  if(gk) parts.push(`${gk} GK`);
  if(arr) parts.push(`${arr} Flechas`);
  const rest = ST.elements.length - a - b - gk - arr;
  if(rest>0) parts.push(`${rest} otros`);
  document.getElementById('footer-stats').textContent = parts.join(' · ') || '0 elementos';
 },

 // ── KEYBOARD ──
 bindKeys() {
  document.addEventListener('keydown', e => {
   if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
   if(e.key===' ') { ST.spaceDown=true; e.preventDefault(); }
   if(e.ctrlKey||e.metaKey) {
    if(e.key==='z') { e.preventDefault(); this.undo(); }
    if(e.key==='y') { e.preventDefault(); this.redo(); }
    if(e.key==='a') { e.preventDefault(); ST.selected=[...ST.elements]; this.renderElements(); this.updatePanel(); }
    if(e.key==='d') { e.preventDefault(); this.duplicateSelected(); }
    if(e.key==='s') { e.preventDefault(); this.exportPNG(); }
   }
   if(e.key==='Delete'||e.key==='Backspace') { this.deleteSelected(); }
   if(e.key==='Escape') { ST.selected=[]; ST.drawing=null; this.renderElements(); this.updatePanel(); document.getElementById('handles-layer').innerHTML=''; }
   if(e.key==='+'||e.key==='=') this.zoomIn();
   if(e.key==='-') this.zoomOut();
   if(e.key==='0') this.zoomReset();
   if(e.key==='2') this.setView('2d');
   if(e.key==='3') this.setView('2.5d');
   if(e.key==='4') this.setView('3d');
   if(e.key==='r'||e.key==='R') this.rotateField(90);
   if(e.key==='m'||e.key==='M') this.flipField('h');
   if(e.key==='f'||e.key==='F') this.zoomReset();
   if(e.key==='h'||e.key==='H') { document.getElementById('panel').style.display = document.getElementById('panel').style.display==='none'?'flex':'none'; }
   if(e.key==='p'||e.key==='P') this.startPlayback();
   if(e.key==='Tab') { e.preventDefault(); const modes=['tactical','jersey','avatar']; const i=(modes.indexOf(ST.avatarMode)+1)%3; this.setAvatarMode(modes[i]); }
  });
  document.addEventListener('keyup', e => {
   if(e.key===' ') ST.spaceDown=false;
  });
 },


 bindJoystick() {
  const pad = document.getElementById('joy-pad');
  const thumb = document.getElementById('joy-thumb');
  if(!pad||!thumb) return;
  let dragging = false;
  const onMove = (e) => {
   if(!dragging) return;
   const r = pad.getBoundingClientRect();
   const cx = r.left+r.width/2, cy = r.top+r.height/2;
   let dx = (e.clientX-cx)/(r.width/2), dy = (e.clientY-cy)/(r.height/2);
   const dist = Math.sqrt(dx*dx+dy*dy);
   if(dist>1){dx/=dist;dy/=dist;}
   thumb.style.left = (50+dx*35)+'%';
   thumb.style.top = (50+dy*35)+'%';
   ST.isoAz = 45 + dx*40;
   ST.isoEl = 35 - dy*25;
   ST.isoEl = Math.max(10,Math.min(80,ST.isoEl));
   this.render3DField();
   this.renderElements();
  };
  thumb.addEventListener('mousedown',()=>{dragging=true;document.addEventListener('mousemove',onMove);});
  document.addEventListener('mouseup',()=>{
   if(!dragging) return;
   dragging=false;
   document.removeEventListener('mousemove',onMove);
   thumb.style.left='50%';thumb.style.top='50%';
  });
 },

 duplicateSelected() {
  const newEls = ST.selected.map(el => {
   const ne = {...el, id: ST.nextId++, x: (el.x||0)+20, y: (el.y||0)+20};
   if(ne.x1!==undefined) { ne.x1+=20; ne.y1+=20; ne.x2+=20; ne.y2+=20; }
   if(ne.points) ne.points = ne.points.map(p=>({x:p.x+20,y:p.y+20}));
   return ne;
  });
  ST.elements.push(...newEls);
  ST.selected = newEls;
  this.saveHistory(); this.renderElements(); this.updatePanel(); this.updateStats();
 },

 // ── CONTEXT MENU ──
 showContextMenu(x, y) {
  const cm = document.getElementById('ctx-menu');
  cm.innerHTML = `
   <button class="ctx-item" onclick="S.duplicateSelected();S.hideCtx()">Duplicar</button>
   <button class="ctx-item" onclick="S.bringToFront();S.hideCtx()">Traer al frente</button>
   <button class="ctx-item" onclick="S.sendToBack();S.hideCtx()">Enviar atras</button>
   <div class="ctx-sep"></div>
   <button class="ctx-item" style="color:#f44" onclick="S.deleteSelected();S.hideCtx()">Eliminar</button>`;
  cm.style.left = x+'px'; cm.style.top = y+'px';
  cm.classList.add('show');
  setTimeout(()=>document.addEventListener('click',function h(){cm.classList.remove('show');document.removeEventListener('click',h)},true),10);
 },
 hideCtx() { document.getElementById('ctx-menu').classList.remove('show'); },

 bringToFront() {
  ST.selected.forEach(el => {
   const idx = ST.elements.indexOf(el);
   if(idx>=0) { ST.elements.splice(idx,1); ST.elements.push(el); }
  });
  this.saveHistory(); this.renderElements();
 },
 sendToBack() {
  ST.selected.forEach(el => {
   const idx = ST.elements.indexOf(el);
   if(idx>=0) { ST.elements.splice(idx,1); ST.elements.unshift(el); }
  });
  this.saveHistory(); this.renderElements();
 },

 placeDisposition(type) {
  document.getElementById('modal-overlay').classList.remove('show');
  const count = parseInt(document.getElementById('disp-count').value)||6;
  const isB = document.getElementById('disp-teamB').classList.contains('active');
  const elType = isB ? 'playerB' : 'playerA';
  const cx=400, cy=300;
  let positions = [];

  if(type==='d_row') {
   const spacing = 600/count;
   for(let i=0;i<count;i++) positions.push({x: 100 + spacing*i + spacing/2, y: cy});
  } else if(type==='d_circle') {
   const r = Math.min(180, 30*count/Math.PI);
   for(let i=0;i<count;i++) { const a = (2*Math.PI*i/count) - Math.PI/2; positions.push({x: cx+r*Math.cos(a), y: cy+r*Math.sin(a)}); }
  } else if(type==='d_grid') {
   const cols = Math.ceil(Math.sqrt(count));
   const rows = Math.ceil(count/cols);
   let idx=0;
   for(let r=0;r<rows&&idx<count;r++) for(let c=0;c<cols&&idx<count;c++,idx++) {
    positions.push({x: cx - (cols-1)*35 + c*70, y: cy - (rows-1)*35 + r*70});
   }
  } else if(type==='d_pairs') {
   const pairs = Math.ceil(count/2);
   for(let i=0;i<pairs;i++) {
    const y = 120 + i*(460/pairs);
    positions.push({x: cx-60, y}); if(positions.length<count) positions.push({x: cx+60, y});
   }
  } else if(type==='d_diamond') {
   positions = [{x:cx,y:cy-120},{x:cx+120,y:cy},{x:cx,y:cy+120},{x:cx-120,y:cy}];
   while(positions.length<count) positions.push({x:cx+Math.random()*100-50, y:cy+Math.random()*100-50});
  } else if(type==='d_triangle') {
   positions = [{x:cx,y:cy-120},{x:cx-100,y:cy+80},{x:cx+100,y:cy+80}];
   while(positions.length<count) positions.push({x:cx+Math.random()*80-40, y:cy+Math.random()*80-40});
  }

  positions.slice(0,count).forEach((pos,i) => {
   setTimeout(()=>{
    this.addElement(elType, pos.x, pos.y);
   }, i*50);
  });
 },

 // ── EXPORT PNG ──
 exportPNG() {
  const svg = document.getElementById('svg-canvas');
  const clone = svg.cloneNode(true);
  const zg = clone.getElementById('zoom-group');
  if(zg) zg.setAttribute('transform','translate(0,0) scale(1)');
  const hl = clone.getElementById('handles-layer'); if(hl) hl.innerHTML='';
  const sl = clone.getElementById('sel-rect-layer'); if(sl) sl.innerHTML='';
  const gl = clone.getElementById('guides-layer'); if(gl) gl.innerHTML='';
  clone.querySelectorAll('span').forEach(s=>{while(s.firstChild)s.parentNode.insertBefore(s.firstChild,s);s.remove()});

  // Adjust viewBox based on view mode
  let vbX=0, vbY=0, vbW=600, vbH=800;
  if(ST.viewMode==='3d') {
   // Calculate isometric bounds from field corners + margin
   const corners = [[0,0],[600,0],[0,800],[600,800]];
   let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
   corners.forEach(([x,y])=>{
    const p=this.toIso(x,y,0);
    minX=Math.min(minX,p.x); minY=Math.min(minY,p.y);
    maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y);
   });
   // Add margin for elements and 3D objects (goals, nets extend beyond field)
   const margin = 60;
   vbX = minX - margin; vbY = minY - margin;
   vbW = maxX - minX + margin*2; vbH = maxY - minY + margin*2;
  }
  clone.setAttribute('viewBox', `${vbX} ${vbY} ${vbW} ${vbH}`);

  // Canvas size matches viewBox aspect ratio at 2x resolution
  const scale = 2;
  const cw = Math.round(vbW * scale);
  const ch = Math.round(vbH * scale);

  const data = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([data],{type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = ()=>{
   const c = document.createElement('canvas');
   c.width = cw; c.height = ch;
   const ctx = c.getContext('2d');
   ctx.fillStyle='#ffffff';
   ctx.fillRect(0,0,cw,ch);
   ctx.drawImage(img,0,0,cw,ch);
   URL.revokeObjectURL(url);
   const a = document.createElement('a');
   a.download=`pizarra_${ST.sport.replace(/\s+/g,'_')}_${new Date().toISOString().split('T')[0]}.png`;
   a.href=c.toDataURL('image/png');
   a.click();
  };
  img.src = url;
 },

 // ── PLAYBACK ENGINE (moves real players along arrows) ──
 startPlayback() {
  const arrows = ST.elements.filter(e => e.type === 'arrow');
  if (!arrows.length) {
   alert('No hay flechas en la pizarra. Dibuja flechas cerca de los jugadores para crear movimientos.');
   return;
  }
  arrows.sort((a, b) => (a.playOrder || 0) - (b.playOrder || 0));
  
  // Save original positions of all players
  ST.playbackOriginalPos = {};
  ST.elements.forEach(el => {
   if (el.type === 'playerA' || el.type === 'playerB' || el.type === 'goalkeeper') {
    ST.playbackOriginalPos[el.id] = { x: el.x, y: el.y };
   }
  });
  
  // Build CHAINS of connected arrows
  // If arrow B starts near where arrow A ends, they form a chain (same player follows A→B)
  const CHAIN_DIST = 80;
  const usedArrowIds = new Set();
  const chains = [];
  
  arrows.forEach(arrow => {
   if (usedArrowIds.has(arrow.id)) return;
   const chain = [arrow];
   usedArrowIds.add(arrow.id);
   // Follow the chain forward: find arrows whose start is near current chain's end
   let searching = true;
   while (searching) {
    searching = false;
    const lastSeg = chain[chain.length - 1];
    const endX = lastSeg.x2, endY = lastSeg.y2;
    for (const next of arrows) {
     if (usedArrowIds.has(next.id)) continue;
     const dx = next.x1 - endX, dy = next.y1 - endY;
     if (Math.sqrt(dx * dx + dy * dy) < CHAIN_DIST) {
      chain.push(next);
      usedArrowIds.add(next.id);
      searching = true;
      break;
     }
    }
   }
   chains.push(chain);
  });
  
  // Assign one player per chain (nearest to first arrow's start)
  ST.playbackChains = [];
  const usedPlayers = new Set();
  let matched = 0;
  
  chains.forEach(chain => {
   const first = chain[0];
   const player = this.findNearestPlayerForPlayback(first.x1, first.y1, usedPlayers);
   const segments = chain.map(a => ({
    arrow: a, fromX: a.x1, fromY: a.y1, toX: a.x2, toY: a.y2, cx: a.cx, cy: a.cy
   }));
   if (player) {
    usedPlayers.add(player.id);
    matched++;
    ST.playbackChains.push({ playerId: player.id, segments });
   } else {
    ST.playbackChains.push({ playerId: null, segments });
   }
  });
  
  if (!matched) {
   alert('No se encontraron jugadores cerca de las flechas. Coloca jugadores cerca del inicio de cada flecha.');
   ST.playbackOriginalPos = null;
   return;
  }
  
  // Max segments across all chains determines total animation steps
  ST.playbackMaxSegs = Math.max(...ST.playbackChains.map(c => c.segments.length));
  // Flatten all segments for trail drawing
  ST.playbackAllSegments = ST.playbackChains.reduce((arr, c) => arr.concat(c.segments), []);
  
  ST.playbackSpeed = ST.playbackSpeed || 1;
  ST.playbackState = 'playing';
  ST.playbackProgress = 0;
  ST.playbackStartTime = null;
  document.getElementById('playback-bar').classList.add('show');
  document.getElementById('pb-play').classList.add('playing');
  document.getElementById('pb-pause').classList.remove('playing');
  this.renderPlaybackFrame();
 },

 findNearestPlayerForPlayback(x, y, excludeSet) {
  let nearest = null, minDist = 200;
  ST.elements.forEach(el => {
   if (el.type !== 'playerA' && el.type !== 'playerB' && el.type !== 'goalkeeper') return;
   if (excludeSet && excludeSet.has(el.id)) return;
   const dx = el.x - x, dy = el.y - y;
   const dist = Math.sqrt(dx * dx + dy * dy);
   if (dist < minDist) { minDist = dist; nearest = el; }
  });
  return nearest;
 },

 playback(action) {
  if (action === 'play') {
   if (ST.playbackState === 'paused') {
    ST.playbackState = 'playing';
    ST.playbackStartTime = null;
    document.getElementById('pb-play').classList.add('playing');
    document.getElementById('pb-pause').classList.remove('playing');
    this.renderPlaybackFrame();
   } else if (ST.playbackState === 'stopped' || !ST.playbackState) {
    this.startPlayback();
   }
  } else if (action === 'pause') {
   ST.playbackState = 'paused';
   ST.playbackPausedProgress = ST.playbackProgress || 0;
   document.getElementById('pb-play').classList.remove('playing');
   document.getElementById('pb-pause').classList.add('playing');
   if (ST.playbackRAF) cancelAnimationFrame(ST.playbackRAF);
  } else if (action === 'stop') {
   ST.playbackState = 'stopped';
   if (ST.playbackRAF) cancelAnimationFrame(ST.playbackRAF);
   document.getElementById('playback-bar').classList.remove('show');
   document.getElementById('pb-play').classList.remove('playing');
   document.getElementById('pb-pause').classList.remove('playing');
   if (ST.playbackOriginalPos && ST.playbackChains && ST.playbackChains.length) {
    const keep = confirm('¿Mantener las nuevas posiciones de los jugadores?');
    if (!keep) {
     Object.entries(ST.playbackOriginalPos).forEach(([id, pos]) => {
      const el = ST.elements.find(e => e.id === +id);
      if (el) { el.x = pos.x; el.y = pos.y; }
     });
    } else {
     // Keep at final arrow tip of each chain
     ST.playbackChains.forEach(chain => {
      if (!chain.playerId) return;
      const last = chain.segments[chain.segments.length - 1];
      const el = ST.elements.find(e => e.id === chain.playerId);
      if (el) { el.x = last.toX; el.y = last.toY; }
     });
    }
   }
   ST.playbackOriginalPos = null;
   this.renderElements();
  }
 },

 setPlaySpeed(speed) {
  ST.playbackSpeed = speed;
  document.querySelectorAll('.pb-speed').forEach(b => b.classList.remove('active'));
  const btn = speed === 0.5 ? 'pb-s05' : speed === 2 ? 'pb-s2' : 'pb-s1';
  document.getElementById(btn).classList.add('active');
 },

 // Interpolate along a path (line or curve)
 interpolatePath(move, t) {
  t = Math.max(0, Math.min(1, t));
  // Ease in-out for smooth movement
  const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  if (move.cx !== undefined && move.cy !== undefined) {
   // Quadratic bezier
   const u = 1 - ease;
   const x = u * u * move.fromX + 2 * u * ease * move.cx + ease * ease * move.toX;
   const y = u * u * move.fromY + 2 * u * ease * move.cy + ease * ease * move.toY;
   return { x, y };
  }
  // Linear
  return {
   x: move.fromX + (move.toX - move.fromX) * ease,
   y: move.fromY + (move.toY - move.fromY) * ease
  };
 },

 renderPlaybackFrame() {
  if (ST.playbackState !== 'playing') return;
  const chains = ST.playbackChains;
  if (!chains || !chains.length) return;

  const is3D = ST.viewMode === '3d';
  const maxSegs = ST.playbackMaxSegs;
  const STEP_DURATION = 1500 / ST.playbackSpeed;
  const now = performance.now();
  if (!ST.playbackStartTime) {
   ST.playbackStartTime = now;
   if (ST.playbackPausedProgress > 0) {
    ST.playbackStartTime = now - ST.playbackPausedProgress * maxSegs * STEP_DURATION;
    ST.playbackPausedProgress = 0;
   }
  }

  const elapsed = now - ST.playbackStartTime;
  const totalDuration = maxSegs * STEP_DURATION;
  const progress = Math.min(elapsed / totalDuration, 1);
  ST.playbackProgress = progress;

  // stepFloat is a continuous value from 0 to maxSegs
  const stepFloat = progress * maxSegs;
  const currentGlobalStep = Math.min(Math.floor(stepFloat), maxSegs - 1);
  const stepFrac = stepFloat - currentGlobalStep;

  document.getElementById('pb-fill').style.width = (progress * 100) + '%';
  document.getElementById('pb-step').textContent = `Paso ${currentGlobalStep + 1} / ${maxSegs}`;

  // Update player positions: each chain simultaneously
  chains.forEach(chain => {
   if (!chain.playerId) return;
   const el = ST.elements.find(e => e.id === chain.playerId);
   if (!el) return;
   const segs = chain.segments;
   
   if (currentGlobalStep >= segs.length) {
    // This chain is done: player at final arrow tip
    const last = segs[segs.length - 1];
    el.x = last.toX; el.y = last.toY;
   } else {
    // Active segment for this chain
    const seg = segs[currentGlobalStep];
    const pos = this.interpolatePath(seg, stepFrac);
    el.x = pos.x; el.y = pos.y;
   }
  });

  // Re-render
  const layer = document.getElementById('elements-layer');
  let defs = `<defs>
   <marker id="arrow-marker" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="rgba(0,0,0,0.7)" stroke-width="1.5" stroke-linecap="round"/></marker>
   <marker id="play-arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/></marker>
   <filter id="blur3d"><feGaussianBlur stdDeviation="3"/></filter>
   <filter id="shadow3d"><feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.2"/></filter>
  </defs>`;

  let svgParts = '';

  // Render all non-arrow elements (players at animated positions)
  const nonArrows = ST.elements.filter(el => el.type !== 'arrow');
  if (is3D) {
   const projected = nonArrows.map(el => {
    const ey = el.y || 400, ex = el.x || 300;
    const ip = this.toIso(ex, ey, 0);
    return { el, isoY: ip.y };
   });
   projected.sort((a, b) => a.isoY - b.isoY);
   projected.forEach(({ el }) => { svgParts += this.buildIsoElement(el); });
  } else {
   const zOrder = {zone:0, line:1, curve:1, pencil:1, cone:2, disc:2, flag:2, hurdle:2, minigoal:2, mannequin:2, vest:2, ring:2, ladder:2, pole:2, ball:2, playerA:3, playerB:3, goalkeeper:3, text:4};
   const sorted = [...nonArrows].sort((a, b) => (zOrder[a.type] || 2) - (zOrder[b.type] || 2));
   sorted.forEach(el => { svgParts += this.buildElSvg(el); });
  }

  // Draw arrow trails per chain
  chains.forEach(chain => {
   chain.segments.forEach((seg, segIdx) => {
    const a = seg.arrow;
    let x1, y1, x2, y2;
    if (is3D) {
     const p1 = this.toIso(a.x1 || 0, a.y1 || 0, 0);
     const p2 = this.toIso(a.x2 || 0, a.y2 || 0, 0);
     x1 = p1.x; y1 = p1.y; x2 = p2.x; y2 = p2.y;
    } else {
     x1 = a.x1; y1 = a.y1; x2 = a.x2; y2 = a.y2;
    }
    const pathD = `M${x1},${y1}L${x2},${y2}`;

    if (segIdx < currentGlobalStep) {
     // Completed segment
     svgParts += `<path d="${pathD}" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#play-arrow)" opacity="0.5"/>`;
    } else if (segIdx === currentGlobalStep && segIdx < chain.segments.length) {
     // Active segment in this chain
     if (chain.playerId) {
      // Ghost full path
      svgParts += `<path d="${pathD}" fill="none" stroke="rgba(37,99,235,0.15)" stroke-width="1.5" stroke-dasharray="5 3"/>`;
      // Animated partial
      const rawPos = this.interpolatePath(seg, stepFrac);
      let px, py;
      if (is3D) { const pp = this.toIso(rawPos.x, rawPos.y, 0); px = pp.x; py = pp.y; }
      else { px = rawPos.x; py = rawPos.y; }
      svgParts += `<path d="M${x1},${y1}L${px},${py}" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#play-arrow)"/>`;
      svgParts += `<circle cx="${px}" cy="${py}" r="6" fill="rgba(37,99,235,0.2)"/>`;
     }
     // Step badge
     svgParts += `<circle cx="${x1}" cy="${y1-18}" r="9" fill="rgba(37,99,235,0.85)"/><text x="${x1}" y="${y1-18}" dy="0.35em" text-anchor="middle" font-size="8" fill="#fff" font-weight="700">${a.playOrder||''}</text>`;
    } else {
     // Future segment
     svgParts += `<path d="${pathD}" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="1" stroke-dasharray="4 3"/>`;
    }
   });
  });

  layer.innerHTML = defs + svgParts;

  if (progress >= 1) {
   ST.playbackStartTime = null;
   // Ensure all players at their final chain tips
   chains.forEach(chain => {
    if (!chain.playerId) return;
    const last = chain.segments[chain.segments.length - 1];
    const el = ST.elements.find(e => e.id === chain.playerId);
    if (el) { el.x = last.toX; el.y = last.toY; }
   });
   setTimeout(() => {
    if (ST.playbackState === 'playing') this.playback('stop');
   }, 1200);
   return;
  }

  ST.playbackRAF = requestAnimationFrame(() => this.renderPlaybackFrame());
 },

 uploadPlayerPhoto(elId, input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
   // Resize to small thumbnail
   const img = new Image();
   img.onload = () => {
    const c = document.createElement('canvas');
    const sz = 80;
    c.width = sz; c.height = sz;
    const ctx = c.getContext('2d');
    const min = Math.min(img.width, img.height);
    const sx = (img.width - min) / 2, sy = (img.height - min) / 2;
    ctx.drawImage(img, sx, sy, min, min, 0, 0, sz, sz);
    const dataUrl = c.toDataURL('image/jpeg', 0.7);
    this.setProp(elId, 'photo', dataUrl);
    this.updatePanel();
   };
   img.src = e.target.result;
  };
  reader.readAsDataURL(file);
 },

 // ── ROSTER / PLANTILLA ──
 renderRoster() {
  const pc = document.getElementById('panel-content');
  const players = ST.elements.filter(e => e.type==='playerA'||e.type==='playerB'||e.type==='goalkeeper');
  const teamA = players.filter(p => p.type==='playerA'||p.type==='goalkeeper');
  const teamB = players.filter(p => p.type==='playerB');
  const subs = ST.substitutions || [];

  let html = '';
  // Team A
  html += `<div style="margin-bottom:12px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:${ST.teamAColor}">Equipo A (${teamA.length})</span><button style="font-size:9px;padding:2px 8px;border-radius:4px;background:${ST.teamAColor};color:#fff;font-weight:600" onclick="S.addQuickPlayer('playerA')">+ Jugador</button></div>`;
  if(teamA.length === 0) html += `<div style="text-align:center;padding:12px;color:#94a3b8;font-size:10px">Sin jugadores</div>`;
  teamA.forEach(p => {
   html += this.buildRosterCard(p);
  });
  html += `</div>`;

  // Team B
  html += `<div style="margin-bottom:12px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:${ST.teamBColor}">Equipo B (${teamB.length})</span><button style="font-size:9px;padding:2px 8px;border-radius:4px;background:${ST.teamBColor};color:#fff;font-weight:600" onclick="S.addQuickPlayer('playerB')">+ Jugador</button></div>`;
  if(teamB.length === 0) html += `<div style="text-align:center;padding:12px;color:#94a3b8;font-size:10px">Sin jugadores</div>`;
  teamB.forEach(p => {
   html += this.buildRosterCard(p);
  });
  html += `</div>`;

  // Substitutions section
  html += `<div style="border-top:1px solid var(--border);padding-top:8px;margin-top:4px">`;
  html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted)">Cambios / Sustituciones</span><button style="font-size:9px;padding:2px 8px;border-radius:4px;background:var(--primary);color:#fff;font-weight:600" onclick="S.addSubstitution()">+ Cambio</button></div>`;
  if(subs.length === 0) html += `<div style="text-align:center;padding:8px;color:#94a3b8;font-size:10px">Sin cambios registrados</div>`;
  subs.forEach((sub, idx) => {
   const playerOut = players.find(p => p.id === sub.outId);
   const playerIn = sub.inName || 'Suplente';
   html += `<div style="display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;background:#fef2f2;border:1px solid #fecaca;margin-bottom:3px;font-size:10px">`;
   html += `<span style="color:#ef4444;font-weight:700">↓</span>`;
   html += `<span style="flex:1;color:#991b1b">${playerOut?.name||playerOut?.label||'#'+sub.outId}</span>`;
   html += `<span style="color:#16a34a;font-weight:700">↑</span>`;
   html += `<input value="${playerIn}" onchange="S.updateSub(${idx},'inName',this.value)" style="flex:1;height:20px;font-size:10px;border:1px solid #d1d5db;border-radius:3px;padding:0 4px">`;
   html += `<input value="${sub.minute||''}" onchange="S.updateSub(${idx},'minute',this.value)" style="width:30px;height:20px;font-size:10px;border:1px solid #d1d5db;border-radius:3px;padding:0 3px;text-align:center" placeholder="min">`;
   html += `<button onclick="S.removeSub(${idx})" style="color:#f44;font-size:11px;font-weight:700;width:16px;height:16px;display:flex;align-items:center;justify-content:center">✕</button>`;
   html += `</div>`;
  });
  html += `</div>`;

  pc.innerHTML = html;
 },

 buildRosterCard(p) {
  const c = p.color || (p.type==='goalkeeper'?'#EF9F27':ST.teamAColor);
  const isGK = p.type === 'goalkeeper';
  let card = `<div style="display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:8px;background:#fff;border:1px solid var(--border);margin-bottom:3px;cursor:pointer;transition:all .12s" onclick="S.selectEl(${p.id})" onmouseenter="this.style.borderColor='${c}'" onmouseleave="this.style.borderColor='var(--border)'">`;
  // Photo or number
  if(p.photo) {
   card += `<img src="${p.photo}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid ${c};flex-shrink:0">`;
  } else {
   card += `<div style="width:28px;height:28px;border-radius:50%;background:${c}22;border:2px solid ${c};display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:800;color:${c}">${p.label||''}</div>`;
  }
  // Info
  card += `<div style="flex:1;min-width:0">`;
  card += `<div style="font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name||'Sin nombre'} <span style="color:${c};font-weight:800">#${p.label||''}</span></div>`;
  card += `<div style="font-size:9px;color:var(--text-muted)">${isGK?'Portero':p.position||'Sin posición'}</div>`;
  card += `</div>`;
  // Quick photo upload
  card += `<label style="cursor:pointer;flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--hover);display:flex;align-items:center;justify-content:center" title="Subir foto"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 1v10M1 6h10"/></svg><input type="file" accept="image/*" style="display:none" onchange="S.uploadPlayerPhoto(${p.id},this);S.renderRoster()"></label>`;
  card += `</div>`;
  return card;
 },

 addQuickPlayer(type) {
  const cx = 300 + Math.random()*200 - 100;
  const cy = type==='playerB' ? 200 + Math.random()*150 : 500 + Math.random()*150;
  this.addElement(type, cx, cy);
  this.renderRoster();
 },

 addSubstitution() {
  if(!ST.substitutions) ST.substitutions = [];
  const players = ST.elements.filter(e => e.type==='playerA'||e.type==='playerB'||e.type==='goalkeeper');
  ST.substitutions.push({ outId: players[0]?.id || 0, inName: '', minute: '' });
  this.renderRoster();
 },

 updateSub(idx, key, val) {
  if(!ST.substitutions) return;
  ST.substitutions[idx][key] = val;
  this.renderRoster();
 },

 removeSub(idx) {
  if(!ST.substitutions) return;
  ST.substitutions.splice(idx, 1);
  this.renderRoster();
 },

 switchTab(tab) {
  ST.panelTab = tab;
  document.getElementById('tab-elements').classList.toggle('active', tab==='elements');
  document.getElementById('tab-roster').classList.toggle('active', tab==='roster');
  document.getElementById('tab-gallery').classList.toggle('active', tab==='gallery');
  if(tab==='gallery') this.loadGallery();
  else if(tab==='roster') this.renderRoster();
  else this.updatePanel();
 },

 // ── GENERATE THUMBNAIL SVG ──
 generateThumbnail() {
  const f = FIELDS[ST.sport] || DEFAULT_FIELD;
  const tc = this.getFieldColors();
  let elsSvg = '';
  ST.elements.forEach(el => { elsSvg += this.buildElSvg(el); });
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" style="width:100%;height:100%;display:block">` +
   `<rect width="600" height="800" fill="${tc.bg}"/>` +
   `<defs><marker id="am" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="${tc.stroke}" stroke-width="1.5"/></marker></defs>` +
   `<g stroke="${tc.stroke}" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">${f.svg}</g>` +
   `<g>${elsSvg}</g></svg>`;
  return svg;
 },

 // ── SAVE MODAL ──
 showSaveModal() {
  const mc = document.getElementById('modal-card');
  const defaultName = ST.editingBoardId ? 'Actualizar Pizarra' : 'Nueva Pizarra';
  mc.innerHTML = `
   <h2>✓ Guardar Pizarra</h2>
   <div class="prop-group">
    <div class="prop-label">Nombre</div>
    <div class="prop-row"><input type="text" id="save-name" value="${ST.sport}" style="width:100%" placeholder="Nombre de la pizarra..." data-testid="save-board-name"></div>
   </div>
   <div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn-cancel" style="flex:1" onclick="document.getElementById('modal-overlay').classList.remove('show')">Cancelar</button>
    <button class="btn-guardar" style="flex:1" onclick="S.saveBoardToServer()" data-testid="confirm-save-board">✓ ${ST.editingBoardId?'Actualizar':'Guardar'}</button>
   </div>`;
  document.getElementById('modal-overlay').classList.add('show');
  setTimeout(()=>document.getElementById('save-name')?.focus(),100);
 },

 // ── SAVE TO SERVER ──
 async saveBoardToServer() {
  const nameInput = document.getElementById('save-name');
  const name = nameInput ? nameInput.value.trim() : ST.sport;
  if(!name) { this.showToast('Ingresa un nombre','error'); return; }
  const token = localStorage.getItem('train_token');
  if(!token) { this.showToast('Inicia sesion primero','error'); return; }
  const thumbnail = this.generateThumbnail();
  const body = {
   name: name,
   sport: ST.sport,
   sportName: ST.sport,
   category: ST.cat,
   elements: JSON.parse(JSON.stringify(ST.elements)),
   thumbnail: btoa(unescape(encodeURIComponent(thumbnail)))
  };
  try {
   const url = ST.editingBoardId ? `/api/tactical-boards/${ST.editingBoardId}` : '/api/tactical-boards';
   const method = ST.editingBoardId ? 'PUT' : 'POST';
   const res = await fetch(url, {
    method, headers: {'Content-Type':'application/json','Authorization':`Bearer ${token}`},
    body: JSON.stringify(body)
   });
   if(!res.ok) throw new Error('Error al guardar');
   document.getElementById('modal-overlay').classList.remove('show');
   this.showToast(ST.editingBoardId?'Pizarra actualizada':'Pizarra guardada','success');
   if(!ST.editingBoardId) {
    const data = await res.json();
    ST.editingBoardId = data.id;
   }
   // Notify opener (SessionEditor) if opened from there
   if(window.opener && !window.opener.closed) {
    window.opener.postMessage({type:'tactical-board-saved', boardId:ST.editingBoardId, sport:ST.sport, name:name, thumbnail:thumbnail, elements:ST.elements},'*');
   }
   // Notify other tabs (Herramientas gallery) via BroadcastChannel
   try { new BroadcastChannel('tactical-board').postMessage({type:'tactical-board-saved'}); } catch(e){}
   this.loadGallery();
  } catch(e) {
   this.showToast('Error al guardar: '+e.message,'error');
  }
 },

 // ── LOAD GALLERY ──
 async loadGallery() {
  const pc = document.getElementById('panel-content');
  const token = localStorage.getItem('train_token');
  if(!token) {
   pc.innerHTML = '<div class="gallery-empty">Inicia sesion para ver tus pizarras guardadas</div>';
   return;
  }
  pc.innerHTML = '<div class="gallery-empty">Cargando...</div>';
  try {
   const res = await fetch('/api/tactical-boards', {
    headers: {'Authorization':`Bearer ${token}`}
   });
   if(!res.ok) throw new Error('Error');
   ST.gallery = await res.json();
   this.renderGallery();
  } catch(e) {
   pc.innerHTML = '<div class="gallery-empty">Error al cargar galeria</div>';
  }
 },

 // ── RENDER GALLERY ──
 renderGallery() {
  const pc = document.getElementById('panel-content');
  if(ST.gallery.length===0) {
   pc.innerHTML = '<div class="gallery-empty">Sin pizarras guardadas.<br>Usa el boton ✓ Guardar para crear una.</div>';
   return;
  }
  let html = '';
  ST.gallery.forEach(b => {
   const isActive = ST.editingBoardId === b.id;
   const thumbSvg = b.thumbnail ? decodeURIComponent(escape(atob(b.thumbnail))) : '';
   const date = b.updated_at ? new Date(b.updated_at).toLocaleDateString('es') : '';
   html += `<div class="gallery-item${isActive?' selected':''}" data-testid="gallery-item-${b.id}">
    <div class="gallery-thumb">${thumbSvg}</div>
    <div class="gallery-name">${b.name||'Sin nombre'}</div>
    <div class="gallery-meta"><span>${b.sportName||b.sport||''}</span><span>${date}</span></div>
    <div class="gallery-actions">
     <button class="gallery-btn" onclick="S.loadBoard('${b.id}')">Cargar</button>
     <button class="gallery-btn del" onclick="event.stopPropagation();S.deleteBoard('${b.id}')">Eliminar</button>
    </div>
   </div>`;
  });
  pc.innerHTML = html;
 },

 // ── LOAD BOARD ──
 async loadBoard(id) {
  const token = localStorage.getItem('train_token');
  if(!token) return;
  try {
   const res = await fetch(`/api/tactical-boards/${id}`, {
    headers: {'Authorization':`Bearer ${token}`}
   });
   if(!res.ok) throw new Error('Error');
   const board = await res.json();
   // Set sport without clearing (we'll replace elements)
   ST.sport = board.sport || board.sportName || ST.sport;
   ST.cat = board.category || ST.cat;
   const f = FIELDS[ST.sport] || DEFAULT_FIELD;
   const tc = this.getFieldColors();
   const fl = document.getElementById('field-layer');
   fl.innerHTML = `<rect x="0" y="0" width="600" height="800" fill="${tc.bg}" rx="0"/>` +
    `<g stroke="${tc.stroke}" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">${f.svg}</g>`;
   // Restore elements
   ST.elements = board.elements || [];
   ST.nextId = ST.elements.reduce((max,el)=>Math.max(max,(el.id||0)+1),1);
   ST.selected = [];
   ST.editingBoardId = id;
   this.saveHistory();
   this.renderElements();
   this.renderTabs();
   this.updatePanel();
   this.updateStats();
   this.showToast('Pizarra cargada','success');
   this.switchTab('elements');
  } catch(e) {
   this.showToast('Error al cargar pizarra','error');
  }
 },

 // ── DELETE BOARD ──
 async deleteBoard(id) {
  if(!confirm('¿Eliminar esta pizarra?')) return;
  const token = localStorage.getItem('train_token');
  if(!token) return;
  try {
   const res = await fetch(`/api/tactical-boards/${id}`, {
    method:'DELETE', headers: {'Authorization':`Bearer ${token}`}
   });
   if(!res.ok) throw new Error('Error');
   if(ST.editingBoardId===id) ST.editingBoardId=null;
   this.showToast('Pizarra eliminada','success');
   this.loadGallery();
  } catch(e) {
   this.showToast('Error al eliminar','error');
  }
 }
};

// ── MODAL CLOSE ──
document.getElementById('modal-overlay').addEventListener('click', e => {
 if(e.target === document.getElementById('modal-overlay'))
  document.getElementById('modal-overlay').classList.remove('show');
});

// ── INIT ──
S.init();
// Auto-load board from URL params
(async function() {
 const params = new URLSearchParams(window.location.search);
 const boardId = params.get('boardId');
 if(boardId) {
  const token = localStorage.getItem('train_token');
  if(token) {
   try {
    const res = await fetch(`/api/tactical-boards/${boardId}`, {headers:{'Authorization':`Bearer ${token}`}});
    if(res.ok) {
     const board = await res.json();
     ST.sport = board.sport || board.sportName || ST.sport;
     ST.cat = board.category || ST.cat;
     const f = FIELDS[ST.sport] || DEFAULT_FIELD;
     const tc = S.getFieldColors();
     document.getElementById('field-layer').innerHTML = `<rect x="0" y="0" width="600" height="800" fill="${tc.bg}" rx="0"/>` +
      `<g stroke="${tc.stroke}" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">${f.svg}</g>`;
     ST.elements = board.elements || [];
     ST.nextId = ST.elements.reduce((max,el)=>Math.max(max,(el.id||0)+1),1);
     ST.editingBoardId = boardId;
     S.saveHistory(); S.renderElements(); S.renderTabs(); S.updatePanel(); S.updateStats();
     S.showToast('Pizarra cargada','success');
    }
   } catch(e) { console.error('Auto-load failed:', e); }
  }
 }
})();
</script>
