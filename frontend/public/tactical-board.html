   // Side walls (L/R), angled
   const slv1=this.toIso(120,40,0), slv2=this.toIso(120,760,0), slv1t=this.toIso(120,40,wh), slv2t=this.toIso(120,760,wh);
   O += `<polygon points="${slv1.x},${slv1.y} ${slv2.x},${slv2.y} ${slv2t.x},${slv2t.y} ${slv1t.x},${slv1t.y}" fill="rgba(100,140,200,0.08)" stroke="rgba(0,0,0,0.45)" stroke-width="1.5"/>`;
   const srv1=this.toIso(480,40,0), srv2=this.toIso(480,760,0), srv1t=this.toIso(480,40,wh), srv2t=this.toIso(480,760,wh);
   O += `<polygon points="${srv1.x},${srv1.y} ${srv2.x},${srv2.y} ${srv2t.x},${srv2t.y} ${srv1t.x},${srv1t.y}" fill="rgba(100,140,200,0.08)" stroke="rgba(0,0,0,0.45)" stroke-width="1.5"/>`;
  }
  // Fronton front wall (taller, with horizontal zone lines)
  if(s==='Fronton') {
   const wh=180;
   const wl=this.toIso(90,40,0),wr=this.toIso(510,40,0);
   const wlt=this.toIso(90,40,wh),wrt=this.toIso(510,40,wh);
   O += `<polygon points="${wl.x},${wl.y} ${wr.x},${wr.y} ${wrt.x},${wrt.y} ${wlt.x},${wlt.y}" fill="rgba(200,170,130,0.22)" stroke="rgba(0,0,0,0.75)" stroke-width="2.5"/>`;
   // Horizontal zone markers at 1/3 and 2/3 height
   for (const zh of [60, 120]) {
    const zl=this.toIso(90,40,zh), zr=this.toIso(510,40,zh);
    O += `<line x1="${zl.x}" y1="${zl.y}" x2="${zr.x}" y2="${zr.y}" stroke="rgba(0,0,0,0.3)" stroke-width="1" stroke-dasharray="5 4"/>`;
   }
   // Top cap line
   const tcl=this.toIso(90,40,wh), tcr=this.toIso(510,40,wh);
   O += `<line x1="${tcl.x}" y1="${tcl.y}" x2="${tcr.x}" y2="${tcr.y}" stroke="rgba(0,0,0,0.8)" stroke-width="3"/>`;
  }
  // Bolo Criollo / Bolo Americano: pinos y bolas se agregan como elementos arrastrables desde el panel
  // (antes había pinos decorativos fijos; ahora se eliminan para que el entrenador los posicione libremente)
  // Dark theme: remap hard-coded dark greys/blacks to chalk-white so structures are visible against the green chalkboard
  if (ST.theme === 'dark') {
   O = O.replace(/rgba\(0,0,0,/g, 'rgba(240,235,220,')
        .replace(/rgba\(20,20,20,/g, 'rgba(240,235,220,')
        .replace(/rgba\(30,30,30,/g, 'rgba(235,230,215,')
        .replace(/rgba\(40,40,40,/g, 'rgba(235,230,215,')
        .replace(/rgba\(50,50,50,/g, 'rgba(225,220,205,')
        .replace(/rgba\(60,60,60,/g, 'rgba(215,210,195,')
        .replace(/rgba\(80,80,80,/g, 'rgba(210,205,190,');
  }
  return O;
 },

 // ── ISO PRESETS ──
 setIsoPreset(preset) {
  if(preset==='top') { ST.isoAz=45; ST.isoEl=75; }
  else if(preset==='front') { ST.isoAz=45; ST.isoEl=20; }
  else if(preset==='left') { ST.isoAz=10; ST.isoEl=35; }
  else if(preset==='right') { ST.isoAz=80; ST.isoEl=35; }
  this.updateIsoAngleBtns();
  this.render3DField(); this.renderElements();
 },

 togglePresentation() {
  const isOn = document.body.classList.toggle('presentation-mode');
  if (isOn) {
   // Enter fullscreen
   try { (document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()) ||
          (document.documentElement.webkitRequestFullscreen && document.documentElement.webkitRequestFullscreen()); } catch(e){}
   // Inject exit button + controls
   if (!document.getElementById('exit-presentation')) {
    const exitBtn = document.createElement('button');
    exitBtn.id = 'exit-presentation';
    exitBtn.className = 'exit-presentation';
    exitBtn.setAttribute('data-testid', 'exit-presentation-btn');
    exitBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Salir (ESC)';
    exitBtn.onclick = () => S.togglePresentation();
    document.body.appendChild(exitBtn);
    const ctrls = document.createElement('div');
    ctrls.id = 'presentation-controls';
    ctrls.className = 'presentation-controls';
    ctrls.innerHTML = `
      <button onclick="S.setView('2d')" data-view="2d" data-testid="pres-2d">2D</button>
      <button onclick="S.setView('2.5d')" data-view="2.5d" data-testid="pres-25d">2.5D</button>
      <button onclick="S.setView('3d')" data-view="3d" data-testid="pres-3d">3D</button>
      <span style="width:1px;background:rgba(255,255,255,0.2);margin:0 4px"></span>
      <button onclick="S.startPlayback()" data-testid="pres-play">▶ Play</button>
      <button onclick="S.resetIsoView && S.resetIsoView()" data-testid="pres-reset">Reset</button>
    `;
    document.body.appendChild(ctrls);
    // Highlight active view
    setTimeout(()=>{ctrls.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===ST.viewMode));}, 100);
   }
  } else {
   try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e){}
   const ex = document.getElementById('exit-presentation'); if (ex) ex.remove();
   const cc = document.getElementById('presentation-controls'); if (cc) cc.remove();
  }
 },

 setIsoAngle(el) {
  ST.isoEl = el;
  this.updateIsoAngleBtns();
  this.render3DField(); this.renderElements();
 },

 resetIsoView() {
  ST.isoAz = 45; ST.isoEl = 35;
  this.updateIsoAngleBtns();
  this.render3DField(); this.renderElements();
 },

 updateIsoAngleBtns() {
  const bar = document.getElementById('iso-angle-bar');
  if(!bar) return;
  bar.querySelectorAll('.iso-angle-btn[data-angle]').forEach(b => {
   b.classList.toggle('active', Math.abs(parseInt(b.dataset.angle) - ST.isoEl) < 5);
  });
 },

 // ── 3D ELEMENT SVG ──
 buildIsoElement(el) {
  if(el.type==='zone') return this.buildElSvg(el);
  const ex = el.x||0, ey = el.y||0;
  const p = this.toIso(ex, ey, 0);

  // Depth-based scale
  const maxIsoY = this.toIso(300,800,0).y;
  const minIsoY = this.toIso(300,0,0).y;
  const t = Math.max(0,Math.min(1,(p.y-minIsoY)/(maxIsoY-minIsoY)));
  const ds = 0.5 + t*0.6;

  if(el.type==='playerA'||el.type==='playerB'||el.type==='goalkeeper') return this.buildIsoPlayer(el, p, ds);
  if(el.type==='ball') return this.buildIsoBall(el, p, ds);
  if(el.type==='cone') return this.buildIsoCone(el, p, ds);
  if(el.type==='arrow') return this.buildIsoArrow(el);
  if(el.type==='line') return this.buildIsoLine(el);
  if(el.type==='pencil') return this.buildIsoPencil(el);
  if(el.type==='curve') return this.buildIsoCurve(el);
  if(el.type==='text') {
   return `<text x="${p.x}" y="${p.y}" text-anchor="middle" font-size="${(el.fontSize||16)*ds}" fill="${el.color||'#1e293b'}" font-weight="${el.bold?800:600}" data-id="${el.id}" style="cursor:grab">${el.label||''}</text>`;
  }
  if(el.type==='flag') return this.buildIsoFlag(el, p, ds);
  if(el.type==='hurdle') return this.buildIsoHurdle(el, p, ds);
  if(el.type==='disc') return this.buildIsoDisc(el, p, ds);
  if(el.type==='minigoal') return this.buildIsoMinigoal(el, p, ds);
  if(el.type==='mannequin') return this.buildIsoMannequin(el, p, ds);
  if(el.type==='vest') return this.buildIsoVest(el, p, ds);
  if(el.type==='ring') return this.buildIsoRing(el, p, ds);
  if(el.type==='ladder') return this.buildIsoLadder(el, p, ds);
  if(el.type==='pole') return this.buildIsoPole(el, p, ds);
  // Generic material at iso position
  const s = ds*0.9;
  return `<g transform="translate(${p.x},${p.y}) scale(${s})" data-id="${el.id}" style="cursor:grab"><ellipse cx="0" cy="6" rx="10" ry="3" fill="rgba(0,0,0,0.12)"/>${this.buildElSvgInner(el)}</g>`;
 },

 // Render the inner SVG of a 2D element (without translate wrapper)
 buildElSvgInner(el) {
  switch(el.type) {
   case 'plyobox': return '<rect x="-16" y="-8" width="32" height="20" rx="2" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/><line x1="-16" y1="-8" x2="-10" y2="-14" stroke="rgba(0,0,0,0.5)" stroke-width="1"/><line x1="16" y1="-8" x2="22" y2="-14" stroke="rgba(0,0,0,0.5)" stroke-width="1"/><line x1="-10" y1="-14" x2="22" y2="-14" stroke="rgba(0,0,0,0.5)" stroke-width="1"/>';
   case 'kettlebell': return '<circle cx="0" cy="4" r="8" fill="rgba(60,60,60,0.15)" stroke="rgba(0,0,0,0.6)" stroke-width="1.5"/><path d="M-4,-4 Q0,-10 4,-4" fill="none" stroke="rgba(0,0,0,0.6)" stroke-width="2"/>';
   case 'medball': return `<circle cx="0" cy="0" r="10" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="1.5"/><line x1="-10" y1="0" x2="10" y2="0" stroke="#ef4444" stroke-width="0.8"/>`;
   case 'trx': return '<line x1="-6" y1="-14" x2="-6" y2="2" stroke="rgba(0,0,0,0.6)" stroke-width="2"/><line x1="6" y1="-14" x2="6" y2="2" stroke="rgba(0,0,0,0.6)" stroke-width="2"/><circle cx="-6" cy="6" r="4" fill="none" stroke="rgba(0,0,0,0.6)" stroke-width="1.5"/><circle cx="6" cy="6" r="4" fill="none" stroke="rgba(0,0,0,0.6)" stroke-width="1.5"/><line x1="-6" y1="-14" x2="6" y2="-14" stroke="rgba(0,0,0,0.6)" stroke-width="2"/>';
   case 'sled': return '<rect x="-14" y="-8" width="28" height="16" rx="2" fill="rgba(0,0,0,0.08)" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/><line x1="14" y1="0" x2="24" y2="-6" stroke="rgba(0,0,0,0.4)" stroke-width="2" stroke-dasharray="3 2"/>';
   case 'parachute': return '<path d="M-14,-6 Q0,-16 14,-6" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1.5"/><line x1="-14" y1="-6" x2="0" y2="10" stroke="#2563eb" stroke-width="1"/><line x1="14" y1="-6" x2="0" y2="10" stroke="#2563eb" stroke-width="1"/>';
   case 'rope': return '<path d="M-8,8 Q-4,-4 0,2 Q4,8 8,-4" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="2" stroke-linecap="round"/>';
   case 'battlerope': return '<path d="M-20,0 Q-12,-10 -4,0 Q4,10 12,0 Q18,-8 22,0" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="3" stroke-linecap="round"/>';
   case 'roller': return '<rect x="-12" y="-5" width="24" height="10" rx="5" fill="rgba(0,0,0,0.06)" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>';
   case 'band': return `<path d="M-12,0 Q0,-10 12,0 Q0,10 -12,0" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="2"/>`;
   case 'bosu': return '<path d="M-14,4 Q0,-10 14,4" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1.5"/><line x1="-14" y1="4" x2="14" y2="4" stroke="#2563eb" stroke-width="1.5"/>';
   case 'mat': return '<rect x="-18" y="-10" width="36" height="20" rx="3" fill="rgba(34,197,94,0.1)" stroke="#22c55e" stroke-width="1.5"/>';
   default: return '<circle cx="0" cy="0" r="8" fill="rgba(100,100,100,0.15)" stroke="rgba(0,0,0,0.4)" stroke-width="1.5"/>';
  }
 },

 buildIsoPlayer(el, p, ds) {
  const c = el.color;
  const lbl = el.label||'';
  const nm = el.name||'';
  const pos = el.position||'';
  const s = ds*1.1;
  const darkC = this.darken(c,0.65);
  const lightC = this.lighten(c,1.2);
  const cc = this.contrastColor(c);
  const sk = el.skinTone||'#e2c4a8';
  const shw = `<ellipse cx="${p.x+3*s}" cy="${p.y+4*s}" rx="${12*s}" ry="${4*s}" fill="rgba(0,0,0,0.25)" filter="url(#blur3d)"/>`;
  const nmLabel = nm ? `<text x="${p.x}" y="${p.y-60*s}" text-anchor="middle" font-size="11" fill="${c}" font-weight="800" stroke="#fff" stroke-width="3" paint-order="stroke">${nm}</text>` : '';
  const posLabel = pos ? `<text x="${p.x}" y="${p.y+12}" text-anchor="middle" font-size="9" fill="${c}" font-weight="700" stroke="#fff" stroke-width="2" paint-order="stroke">${pos}</text>` : '';

  if(ST.avatarMode==='avatar') {
   const style = ST.avatarStyle||'modern';
   const h = 50*s;
   const headR = 8*s;
   const photoHead = el.photo ? `<defs><clipPath id="iso3d${el.id}"><circle cx="0" cy="${-8*s}" r="${headR}"/></clipPath></defs><image href="${el.photo}" x="${-headR}" y="${-8*s-headR}" width="${headR*2}" height="${headR*2}" clip-path="url(#iso3d${el.id})" preserveAspectRatio="xMidYMid slice"/><circle cx="0" cy="${-8*s}" r="${headR}" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>` :
    `<circle cx="0" cy="${-8*s}" r="${headR}" fill="${sk}"/><circle cx="${-2*s}" cy="${-9*s}" r="${1*s}" fill="#555"/><circle cx="${2*s}" cy="${-9*s}" r="${1*s}" fill="#555"/>`;

   if(style==='chibi') {
    const bigHead = el.photo ? `<defs><clipPath id="isoc${el.id}"><circle cx="0" cy="${-16*s}" r="${12*s}"/></clipPath></defs><image href="${el.photo}" x="${-12*s}" y="${-28*s}" width="${24*s}" height="${24*s}" clip-path="url(#isoc${el.id})" preserveAspectRatio="xMidYMid slice"/><circle cx="0" cy="${-16*s}" r="${12*s}" fill="none" stroke="${c}" stroke-width="${2*s}"/>` :
     `<circle cx="0" cy="${-16*s}" r="${12*s}" fill="${sk}" stroke="${c}" stroke-width="${2*s}"/>
      <circle cx="${-3*s}" cy="${-19*s}" r="${3*s}" fill="#fff"/><circle cx="${3*s}" cy="${-19*s}" r="${3*s}" fill="#fff"/>
      <circle cx="${-3*s}" cy="${-19*s}" r="${1.8*s}" fill="#333"/><circle cx="${3*s}" cy="${-19*s}" r="${1.8*s}" fill="#333"/>
      <path d="M${-2*s},${-11*s} Q0,${-8*s} ${2*s},${-11*s}" fill="#e8836b"/>`;
    return `<g data-id="${el.id}" style="cursor:grab">${shw}<g transform="translate(${p.x},${p.y-35*s})">
     <rect x="${-7*s}" y="${-2*s}" width="${14*s}" height="${12*s}" rx="${3*s}" fill="${c}"/>
     <text x="0" y="${7*s}" text-anchor="middle" font-size="${9*s}" fill="${cc}" font-weight="800">${lbl}</text>
     <rect x="${-4*s}" y="${10*s}" width="${3.5*s}" height="${7*s}" rx="${1.5*s}" fill="#1a1a1a"/><rect x="${0.5*s}" y="${10*s}" width="${3.5*s}" height="${7*s}" rx="${1.5*s}" fill="#1a1a1a"/>
     ${bigHead}
    </g>${nmLabel}${posLabel}</g>`;
   }

   if(style==='pixel') {
    const pixHead = el.photo ? `<defs><clipPath id="isop${el.id}"><rect x="${-7*s}" y="${-24*s}" width="${14*s}" height="${14*s}"/></clipPath></defs><image href="${el.photo}" x="${-7*s}" y="${-24*s}" width="${14*s}" height="${14*s}" clip-path="url(#isop${el.id})" preserveAspectRatio="xMidYMid slice"/>` :
     `<rect x="${-7*s}" y="${-24*s}" width="${14*s}" height="${14*s}" fill="${sk}"/>
      <rect x="${-5*s}" y="${-22*s}" width="${3*s}" height="${3*s}" fill="#333"/><rect x="${2*s}" y="${-22*s}" width="${3*s}" height="${3*s}" fill="#333"/>`;
    return `<g data-id="${el.id}" style="cursor:grab">${shw}<g transform="translate(${p.x},${p.y-h})">
     <rect x="${-9*s}" y="${-8*s}" width="${18*s}" height="${16*s}" fill="${c}"/>
     <rect x="${-1.5*s}" y="${-8*s}" width="${3*s}" height="${16*s}" fill="rgba(255,255,255,0.15)"/>
     <text x="0" y="${2*s}" text-anchor="middle" font-size="${9*s}" fill="${cc}" font-weight="900" font-family="monospace">${lbl}</text>
     <rect x="${-5*s}" y="${8*s}" width="${4*s}" height="${9*s}" fill="#222"/><rect x="${1*s}" y="${8*s}" width="${4*s}" height="${9*s}" fill="#222"/>
     ${pixHead}
    </g>${nmLabel}${posLabel}</g>`;
   }

   if(style==='minimal') {
    const minHead = el.photo ? `<defs><clipPath id="isom${el.id}"><circle cx="0" cy="${-18*s}" r="${7*s}"/></clipPath></defs><image href="${el.photo}" x="${-7*s}" y="${-25*s}" width="${14*s}" height="${14*s}" clip-path="url(#isom${el.id})" preserveAspectRatio="xMidYMid slice"/><circle cx="0" cy="${-18*s}" r="${7*s}" fill="none" stroke="${c}" stroke-width="1"/>` :
     `<circle cx="0" cy="${-18*s}" r="${7*s}" fill="${c}" opacity="0.15" stroke="${c}" stroke-width="1.2"/>`;
    return `<g data-id="${el.id}" style="cursor:grab">${shw}<g transform="translate(${p.x},${p.y-h*0.7})">
     <rect x="${-7*s}" y="${-7*s}" width="${14*s}" height="${18*s}" rx="${7*s}" fill="${c}" opacity="0.85"/>
     <text x="0" y="${4*s}" text-anchor="middle" font-size="${10*s}" fill="${cc}" font-weight="800">${lbl}</text>
     <rect x="${-2.5*s}" y="${11*s}" width="${2*s}" height="${7*s}" rx="${1*s}" fill="${c}" opacity="0.5"/><rect x="${0.5*s}" y="${11*s}" width="${2*s}" height="${7*s}" rx="${1*s}" fill="${c}" opacity="0.5"/>
     ${minHead}
    </g>${nmLabel}${posLabel}</g>`;
   }

   // MODERN (default)
   return `<g data-id="${el.id}" style="cursor:grab">${shw}<g transform="translate(${p.x},${p.y-h})">
    <rect x="${-5*s}" y="${34*s}" width="${4*s}" height="${7*s}" rx="${1.5*s}" fill="#2a2a2a"/>
    <rect x="${1*s}" y="${34*s}" width="${4*s}" height="${7*s}" rx="${1.5*s}" fill="#2a2a2a"/>
    <polygon points="${-10*s},${2*s} ${10*s},${2*s} ${10*s},${20*s} ${-10*s},${20*s}" fill="${c}"/>
    <polygon points="0,${2*s} ${10*s},${2*s} ${10*s},${20*s} 0,${20*s}" fill="${darkC}"/>
    <polygon points="${-10*s},${-2*s} ${10*s},${-2*s} ${10*s},${2*s} ${-10*s},${2*s}" fill="${lightC}"/>
    <rect x="${-14*s}" y="${2*s}" width="${5*s}" height="${14*s}" rx="${2.5*s}" fill="${c}" transform="rotate(-8 ${-11*s} ${9*s})"/>
    <rect x="${9*s}" y="${2*s}" width="${5*s}" height="${14*s}" rx="${2.5*s}" fill="${darkC}" transform="rotate(8 ${11*s} ${9*s})"/>
    <text x="0" y="${14*s}" text-anchor="middle" font-size="${10*s}" fill="${cc}" font-weight="800">${lbl}</text>
    ${photoHead}
   </g>${nmLabel}${posLabel}</g>`;

  } else if(ST.avatarMode==='jersey') {
   const h = 35*s;
   const jerseyPhoto = el.photo ? `<defs><clipPath id="isoj${el.id}"><circle cx="0" cy="${-8*s}" r="${6*s}"/></clipPath></defs><image href="${el.photo}" x="${-6*s}" y="${-14*s}" width="${12*s}" height="${12*s}" clip-path="url(#isoj${el.id})" preserveAspectRatio="xMidYMid slice"/><circle cx="0" cy="${-8*s}" r="${6*s}" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>` : '';
   return `<g data-id="${el.id}" style="cursor:grab">${shw}<g transform="translate(${p.x},${p.y-h})">
    <polygon points="${-10*s},0 ${10*s},0 ${10*s},${28*s} ${-10*s},${28*s}" fill="${c}"/>
    <polygon points="0,0 ${10*s},0 ${10*s},${28*s} 0,${28*s}" fill="${darkC}"/>
    <polygon points="${-10*s},${-4*s} ${10*s},${-4*s} ${10*s},0 ${-10*s},0" fill="${lightC}"/>
    <polygon points="${-14*s},${-2*s} ${-10*s},${-4*s} ${-10*s},${10*s} ${-14*s},${8*s}" fill="${c}" opacity="0.8"/>
    <polygon points="${10*s},${-4*s} ${14*s},${-2*s} ${14*s},${8*s} ${10*s},${10*s}" fill="${darkC}" opacity="0.8"/>
    <text x="0" y="${16*s}" text-anchor="middle" font-size="${12*s}" fill="${cc}" font-weight="800">${lbl}</text>
    ${jerseyPhoto}
   </g>${nmLabel}${posLabel}</g>`;

  } else {
   // Tactical 3D sphere
   const r = 14*s;
   const spherePhoto = el.photo ? `<defs><clipPath id="isot${el.id}"><circle cx="0" cy="0" r="${r}"/></clipPath></defs><image href="${el.photo}" x="${-r}" y="${-r}" width="${r*2}" height="${r*2}" clip-path="url(#isot${el.id})" preserveAspectRatio="xMidYMid slice"/><circle cx="0" cy="0" r="${r}" fill="none" stroke="${c}" stroke-width="2"/>` :
    `<circle cx="0" cy="0" r="${r}" fill="${c}"/><circle cx="${-r*0.25}" cy="${-r*0.25}" r="${r*0.4}" fill="rgba(255,255,255,0.2)"/><circle cx="${r*0.15}" cy="${r*0.2}" r="${r*0.3}" fill="rgba(0,0,0,0.1)"/><text x="0" y="0" dy="0.35em" text-anchor="middle" font-size="${r*0.85}" fill="${cc}" font-weight="800">${lbl}</text>`;

   case 'tennis':

   case 'baseball':
    return `${g('#fff','#fafafa','#ccc')}<circle cx="0" cy="0" r="${r}" fill="url(#bg${type}${id})" stroke="#888" stroke-width="${sw}"/><path d="M${-r*0.45},${-r*0.8}Q${-r*0.85},${-r*0.3} ${-r*0.85},0Q${-r*0.85},${r*0.3} ${-r*0.45},${r*0.8}" fill="none" stroke="#d32f2f" stroke-width="${sw}" stroke-dasharray="1.5,1.5"/><path d="M${r*0.45},${-r*0.8}Q${r*0.85},${-r*0.3} ${r*0.85},0Q${r*0.85},${r*0.3} ${r*0.45},${r*0.8}" fill="none" stroke="#d32f2f" stroke-width="${sw}" stroke-dasharray="1.5,1.5"/>${hi}`;

   case 'softball':

   case 'bowling':

 buildIsoBall(el, p, ds) {
  const s = ds;
  const r = (el.size||8)*s;
  const bt = el.ballType||'soccer';
  const svg = this.getBallSvg(bt, r, el.id, true);
  return `<g data-id="${el.id}" style="cursor:grab"><ellipse cx="${p.x+2}" cy="${p.y+2}" rx="${r+1}" ry="${r*0.35}" fill="rgba(0,0,0,0.2)" filter="url(#blur3d)"/><g transform="translate(${p.x},${p.y-r})">${svg}</g></g>`;
 },

 buildIsoCone(el, p, ds) {
  const s = ds*1.1;
  const c = el.color||'#ff9800';
  return `<g data-id="${el.id}" style="cursor:grab"><ellipse cx="${p.x}" cy="${p.y}" rx="${9*s}" ry="${3*s}" fill="rgba(0,0,0,0.18)" filter="url(#blur3d)"/><g transform="translate(${p.x},${p.y})"><polygon points="0,${-22*s} ${-8*s},0 ${8*s},0" fill="${c}"/><polygon points="0,${-22*s} 0,0 ${8*s},0" fill="${this.darken(c,0.7)}"/><ellipse cx="0" cy="0" rx="${8*s}" ry="${2.5*s}" fill="${this.darken(c,0.8)}"/></g></g>`;
 },

 buildIsoArrow(el) {
  const p1 = this.toIso(el.x1||0, el.y1||0, 0);
  const p2 = this.toIso(el.x2||0, el.y2||0, 0);
  const aid = `iag${el.id}`;
  const ac = el.color||'#1e293b';
  return `<g data-id="${el.id}" style="cursor:pointer"><defs><linearGradient id="${aid}" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="${ac}" stop-opacity="0.05"/><stop offset="40%" stop-color="${ac}" stop-opacity="0.3"/><stop offset="100%" stop-color="${ac}" stop-opacity="0.9"/></linearGradient></defs><line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="url(#${aid})" stroke-width="8" stroke-linecap="round" opacity="0.15"/><line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${ac}" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-marker)" ${el.dash?`stroke-dasharray="${el.dash}"`:''}/><circle cx="${p1.x}" cy="${p1.y}" r="3" fill="${ac}" opacity="0.4"/></g>`;
 },

 buildIsoLine(el) {
  const p1 = this.toIso(el.x1||0, el.y1||0, 0);
  const p2 = this.toIso(el.x2||0, el.y2||0, 0);
  return `<g data-id="${el.id}" style="cursor:pointer"><line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${el.color||'#1e293b'}" stroke-width="2" stroke-linecap="round" ${el.dash?`stroke-dasharray="${el.dash}"`:''}/></g>`;
 },

 buildIsoPencil(el) {
  if(!el.points||el.points.length<2) return '';
  const pts = el.points.map(pt => { const p=this.toIso(pt.x,pt.y,0); return `${p.x},${p.y}`; });
  return `<g data-id="${el.id}" style="cursor:pointer"><polyline points="${pts.join(' ')}" fill="none" stroke="${el.color||'#1e293b'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>`;
 },

 buildIsoCurve(el) {
  const p1=this.toIso(el.x1||0,el.y1||0,0), pc=this.toIso(el.cx||0,el.cy||0,0), p2=this.toIso(el.x2||0,el.y2||0,0);
  return `<g data-id="${el.id}" style="cursor:pointer"><path d="M${p1.x},${p1.y} Q${pc.x},${pc.y} ${p2.x},${p2.y}" fill="none" stroke="${el.color||'#1e293b'}" stroke-width="2" stroke-linecap="round" ${el.dash?`stroke-dasharray="${el.dash}"`:''}/></g>`;
 },

 buildIsoFlag(el, p, ds) {
  const s = ds*1.1;

 // ── FIELD ROTATION ──
 rotateField(deg) {
  ST.fieldRotation = (ST.fieldRotation + deg + 360) % 360;
  this.applyFieldTransform();
 },
 flipField(axis) {
  if(axis==='h') ST.fieldFlipH = !ST.fieldFlipH;
  else ST.fieldFlipV = !ST.fieldFlipV;
  this.applyFieldTransform();
 },
 resetFieldTransform() {
  ST.fieldRotation = 0; ST.fieldFlipH = false; ST.fieldFlipV = false;
  this.applyFieldTransform();
 },
 applyFieldTransform() {
  const zg = document.getElementById('zoom-group');
  let t = `translate(${ST.panX},${ST.panY}) scale(${ST.zoom})`;
  t += ` rotate(${ST.fieldRotation} 300 400)`;
  if(ST.fieldFlipH) t += ' translate(600,0) scale(-1,1)';
  if(ST.fieldFlipV) t += ' translate(0,800) scale(1,-1)';
  zg.setAttribute('transform', t);
 },

 // ── AVATAR MODE ──
 setAvatarMode(mode) {
  ST.avatarMode = mode;
  document.querySelectorAll('#avatar-mode-seg .vb-btn').forEach(b => b.classList.toggle('active', b.dataset.avatar===mode));
  document.getElementById('avatar-style-seg').style.display = mode==='avatar' ? '' : 'none';
  document.getElementById('avatar-gender-seg').style.display = mode==='avatar' ? '' : 'none';
  this.renderElements();
 },

 setAvatarStyle(style, fromPicker) {
  ST.avatarStyle = style;
  document.querySelectorAll('.asp-item').forEach(b => b.classList.toggle('active', b.dataset.style===style));
  // Update trigger icon to reflect current style
  const trigger = document.getElementById('avatar-style-icon');
  const selected = document.querySelector(`.asp-item[data-style="${style}"] svg`);
  if(trigger && selected) trigger.innerHTML = selected.innerHTML;
  if(fromPicker) {
   const picker = document.getElementById('avatar-style-picker');
   if(picker) picker.classList.remove('show');
  }
  this.renderElements();
 },

 toggleAvatarStylePicker(e) {
  if(e) e.stopPropagation();
  const picker = document.getElementById('avatar-style-picker');
  const trigger = document.getElementById('avatar-style-trigger');
  if(!picker || !trigger) return;
  if(picker.classList.contains('show')) {
   picker.classList.remove('show');
   return;
  }
  // Position picker below trigger
  const rect = trigger.getBoundingClientRect();
  picker.style.top = (rect.bottom + 8) + 'px';
  picker.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 328)) + 'px';
  picker.classList.add('show');
  const closeHandler = (ev) => {
   if(!picker.contains(ev.target) && !ev.target.closest('#avatar-style-trigger')) {
    picker.classList.remove('show');
    document.removeEventListener('click', closeHandler);
   }
  };
  setTimeout(() => document.addEventListener('click', closeHandler), 50);
 },

 setAvatarGender(g) {
  ST.avatarGender = g;
  document.querySelectorAll('#avatar-gender-seg .vb-btn').forEach(b => b.classList.toggle('active', b.dataset.gender===g));
  this.renderElements();
 },

 contrastColor(hex) {
  if(!hex || hex.length<7) return '#fff';
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (r*0.299+g*0.587+b*0.114)>160 ? '#1e293b' : '#ffffff';
 },

 _photoClip(photo, clipId, cx, cy, r) {

 },

 // ── INLINE TEXT INPUT ──
 startInlineText(svgX, svgY, originalEvent) {
  const svg = document.getElementById('svg-canvas');
  const rect = svg.getBoundingClientRect();
  const pt = svg.createSVGPoint();
  pt.x = svgX; pt.y = svgY;
  const ctm = svg.getScreenCTM();
  const screenPt = pt.matrixTransform(ctm);
  const ts = ST.textStyle || {};
  const font = ts.font || 'Inter';
  const color = ts.color || (ST.theme==='dark' ? '#ffffff' : '#1e293b');
  const size = ts.size || 20;
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Texto...';
  input.style.cssText = `position:fixed;left:${screenPt.x}px;top:${screenPt.y - 14}px;z-index:300;font-size:${size}px;font-family:"${font}",sans-serif;font-weight:700;color:${color};background:rgba(255,255,255,0.95);border:2px solid #2563eb;border-radius:6px;padding:4px 10px;outline:none;min-width:120px;box-shadow:0 2px 12px rgba(37,99,235,0.2);letter-spacing:0.04em`;
  input.setAttribute('data-testid','inline-text-input');
  document.body.appendChild(input);
  setTimeout(() => input.focus(), 50);
  let confirmed = false;
  const confirm = () => {
   if(confirmed) return;
   confirmed = true;
   const txt = input.value.trim();
   if(txt) this.addElement('text', svgX, svgY, {
    label:txt,
    fontFamily: font,
    fontSize: size,
    color: color,
    textStroke: ts.stroke || null,
    textShadow: ts.shadow || false,
    italic: ts.italic || false,
    gradient: ts.gradient || null
   });
   input.remove();
  };
  input.addEventListener('keydown', e => { if(e.key==='Enter') { e.preventDefault(); confirm(); } if(e.key==='Escape') { confirmed=true; input.remove(); } });
  input.addEventListener('blur', () => setTimeout(confirm, 150));
 },

   }

  },true),10);
 },

 setTool(id) {

 },

 // ── CANVAS EVENTS ──
 bindCanvas() {
  const svg = document.getElementById('svg-canvas');
  const getPoint = (e) => {
   const pt = svg.createSVGPoint();
   pt.x = e.clientX; pt.y = e.clientY;
   const ctm = document.getElementById('zoom-group').getScreenCTM();
   if(!ctm) return {x:400,y:300};
   return pt.matrixTransform(ctm.inverse());
  };

  svg.addEventListener('mousedown', e => {
   if(e.button===2) return;
   // Middle mouse button (button===1), Ctrl+left, or Shift+left = pan field (Blender/SketchUp style)
   if(e.button===1 || (e.button===0 && (e.ctrlKey || e.metaKey || e.shiftKey))) {
    e.preventDefault();
    ST.panning = true;
    ST.dragStart = {x:e.clientX, y:e.clientY};
    svg.style.cursor = 'grabbing';
    return;
   }
   const p = getPoint(e);
   const target = e.target.closest('[data-id]');

   if(ST.spaceDown) { ST.panning = true; ST.dragStart = {x:e.clientX,y:e.clientY}; return; }

   if(ST.tool==='move') {
    if(target) {
     const id = target.dataset.id;
     const el = ST.elements.find(x=>x.id==id);
     if(!el) return;
     if(!e.shiftKey) ST.selected = [];
     if(!ST.selected.includes(el)) ST.selected.push(el);
     ST.dragging = 'move';
     ST.dragStart = p;
     ST.dragOffset = ST.selected.map(s=>({id:s.id,ox:s.x,oy:s.y}));
     this.updatePanel();
     this.renderElements();
    } else {
     ST.selected = [];
     ST.selRect = {x:p.x,y:p.y,w:0,h:0};
     this.updatePanel();
     this.renderElements();
    }
   } else if(ST.tool==='eraser') {
    if(target) {
     const id = target.dataset.id;
     ST.elements = ST.elements.filter(x=>x.id!=id);
     ST.selected = [];
     this.saveHistory();
     this.renderElements();
     this.updatePanel();
     this.updateStats();
    }
   } else if(ST.tool==='playerA'||ST.tool==='playerB'||ST.tool==='goalkeeper'||ST.tool==='ball'||ST.tool==='cone'||ST.tool==='flag'||ST.tool==='hurdle'||ST.tool==='disc'||ST.tool==='minigoal'||ST.tool==='mannequin'||ST.tool==='vest'||ST.tool==='ring'||ST.tool==='ladder'||ST.tool==='pole'||ST.tool==='plyobox'||ST.tool==='kettlebell'||ST.tool==='medball'||ST.tool==='trx'||ST.tool==='sled'||ST.tool==='parachute'||ST.tool==='rope'||ST.tool==='battlerope'||ST.tool==='roller'||ST.tool==='band'||ST.tool==='bosu'||ST.tool==='mat'||ST.tool==='dumbbell'||ST.tool==='barbell'||ST.tool==='bench'||ST.tool==='rack'||ST.tool==='treadmill'||ST.tool==='bike'||ST.tool==='rower'||ST.tool==='pullup'||ST.tool==='pilatesball'||ST.tool==='stepper'||ST.tool==='pin_bowling'||ST.tool==='pin_criollo'||ST.tool==='mecha'||ST.tool==='bocin'||ST.tool==='tejo'||ST.tool==='jack'||ST.tool==='bocha_r'||ST.tool==='bocha_b'||ST.tool==='ball_bowling'||ST.tool==='rana_disc'||ST.tool.startsWith('gm_')||ST.tool.startsWith('sp_')||ST.tool.startsWith('p_')) {
    this.addElement(ST.tool, p.x, p.y);
   } else if(ST.tool==='arrow'||ST.tool==='line'||ST.tool==='pass') {
    ST.drawing = {type:ST.tool,x1:p.x,y1:p.y,x2:p.x,y2:p.y};
   } else if(ST.tool==='zone') {
    ST.drawing = {type:'zone',x:p.x,y:p.y,w:0,h:0};
   } else if(ST.tool==='text') {
    // Inline text input
    this.startInlineText(p.x, p.y, e);
   } else if(ST.tool==='pencil') {
    ST.drawing = {type:'pencil',points:[{x:p.x,y:p.y}]};
   } else if(ST.tool==='curve') {
    if(ST.drawing && ST.drawing.type==='curve' && ST.drawing.phase===2) {
     // Phase 2: set control point and finalize
     ST.drawing.cx = p.x; ST.drawing.cy = p.y;
     this.addElement('curve',0,0,{x1:ST.drawing.x1,y1:ST.drawing.y1,cx:p.x,cy:p.y,x2:ST.drawing.x2,y2:ST.drawing.y2});
     ST.drawing = null;
     document.getElementById('handles-layer').innerHTML = '';
    } else {
     // Phase 1: start drawing - set start point
     ST.drawing = {type:'curve',x1:p.x,y1:p.y,cx:p.x,cy:p.y,x2:p.x,y2:p.y,phase:1};
    }
   }
  });

  svg.addEventListener('mousemove', e => {
   const p = getPoint(e);
   if(ST.panning && ST.dragStart) {
    const dx = (e.clientX - ST.dragStart.x)/ST.zoom;
    const dy = (e.clientY - ST.dragStart.y)/ST.zoom;
    ST.panX += dx; ST.panY += dy;
    ST.dragStart = {x:e.clientX,y:e.clientY};
    this.applyZoom();
    return;
   }
   if(ST.dragging==='move' && ST.dragOffset) {
    const dx = p.x - ST.dragStart.x;
    const dy = p.y - ST.dragStart.y;
    ST.dragOffset.forEach(o => {
     const el = ST.elements.find(x=>x.id===o.id);
     if(el) { el.x = o.ox + dx; el.y = o.oy + dy; }
    });
    this.renderElements();
   }
   if(ST.selRect) {
    ST.selRect.w = p.x - ST.selRect.x;
    ST.selRect.h = p.y - ST.selRect.y;
    const sl = document.getElementById('sel-rect-layer');
    const r = ST.selRect;
    const rx = r.w<0?r.x+r.w:r.x, ry = r.h<0?r.y+r.h:r.y;
    sl.innerHTML = `<rect x="${rx}" y="${ry}" width="${Math.abs(r.w)}" height="${Math.abs(r.h)}" class="sel-box"/>`;
   }
   if(ST.drawing) {
    if(ST.drawing.type==='arrow'||ST.drawing.type==='line'||ST.drawing.type==='pass') {
     ST.drawing.x2 = p.x; ST.drawing.y2 = p.y;
     this.renderDrawingPreview();
    } else if(ST.drawing.type==='zone') {
     ST.drawing.w = p.x - ST.drawing.x; ST.drawing.h = p.y - ST.drawing.y;
     this.renderDrawingPreview();
    } else if(ST.drawing.type==='pencil') {
     ST.drawing.points.push({x:p.x,y:p.y});
     this.renderDrawingPreview();
    } else if(ST.drawing.type==='curve') {
     if(ST.drawing.phase===1) { ST.drawing.x2 = p.x; ST.drawing.y2 = p.y; ST.drawing.cx = (ST.drawing.x1+p.x)/2; ST.drawing.cy = Math.min(ST.drawing.y1,p.y)-40; }
     else if(ST.drawing.phase===2) { ST.drawing.cx = p.x; ST.drawing.cy = p.y; }
     this.renderDrawingPreview();
    }
   }
  });

  const endDrag = () => {
   if(ST.panning) { ST.panning = false; ST.dragStart = null; svg.style.cursor = ''; return; }
   if(ST.dragging==='move') { ST.dragging = null; this.saveHistory(); }
   if(ST.selRect) {
    const r = ST.selRect;
    const rx = r.w<0?r.x+r.w:r.x, ry = r.h<0?r.y+r.h:r.y;
    const rw = Math.abs(r.w), rh = Math.abs(r.h);
    ST.selected = ST.elements.filter(el=>el.x>=rx&&el.x<=rx+rw&&el.y>=ry&&el.y<=ry+rh);
    ST.selRect = null;
    document.getElementById('sel-rect-layer').innerHTML = '';
    this.renderElements();
    this.updatePanel();
   }
   if(ST.drawing) {
    const d = ST.drawing;
    if(d.type==='arrow') this.addElement('arrow',0,0,{x1:d.x1,y1:d.y1,x2:d.x2,y2:d.y2});
    else if(d.type==='pass') this.addElement('arrow',0,0,{x1:d.x1,y1:d.y1,x2:d.x2,y2:d.y2,isBallArrow:true,lineStyle:'dashed'});
    else if(d.type==='line') this.addElement('line',0,0,{x1:d.x1,y1:d.y1,x2:d.x2,y2:d.y2});
    else if(d.type==='zone') this.addElement('zone',d.x,d.y,{w:d.w,h:d.h});
    else if(d.type==='pencil'&&d.points.length>2) this.addElement('pencil',0,0,{points:d.points});
    else if(d.type==='curve') {
     if(d.phase===1) { d.phase=2; return; } // Transition to phase 2 - don't end
     this.addElement('curve',0,0,{x1:d.x1,y1:d.y1,cx:d.cx,cy:d.cy,x2:d.x2,y2:d.y2});
    }
    ST.drawing = null;
    document.getElementById('handles-layer').innerHTML = '';
   }
  };
  svg.addEventListener('mouseup', endDrag);
  svg.addEventListener('mouseleave', endDrag);

  // Zoom with pivot at cursor position (natural feel)
  svg.addEventListener('wheel', e => {
   e.preventDefault();
   const rect = svg.getBoundingClientRect();
   const mx = e.clientX - rect.left;
   const my = e.clientY - rect.top;
   // Convert screen (mx, my) to viewBox coords BEFORE zoom change
   const viewBox = svg.viewBox.baseVal;
   const vx = (mx / rect.width) * viewBox.width;
   const vy = (my / rect.height) * viewBox.height;
   // Point in field coords (pre-zoom): (vx - panX) / zoom
   const fx = (vx - ST.panX) / ST.zoom;
   const fy = (vy - ST.panY) / ST.zoom;
   const delta = e.deltaY > 0 ? -0.12 : 0.12;
   const newZoom = Math.max(0.3, Math.min(4, ST.zoom * (1 + delta)));
   // After zoom, adjust pan so cursor point stays at same viewBox location
   ST.panX = vx - fx * newZoom;
   ST.panY = vy - fy * newZoom;
   ST.zoom = newZoom;
   this.applyZoom();
  }, {passive:false});

  // Context menu
  svg.addEventListener('contextmenu', e => {
   e.preventDefault();
   const target = e.target.closest('[data-id]');
   if(target) {
    const id = target.dataset.id;
    const el = ST.elements.find(x=>x.id==id);
    if(el && !ST.selected.includes(el)) { ST.selected = [el]; this.renderElements(); }
   }
   this.showContextMenu(e.clientX, e.clientY);
  });
 },

 renderDrawingPreview() {
  const hl = document.getElementById('handles-layer');

  } else if(d.type==='pass') {

  } else if(d.type==='line') {
   hl.innerHTML = `<line x1="${d.x1}" y1="${d.y1}" x2="${d.x2}" y2="${d.y2}" stroke="rgba(0,0,0,0.5)" stroke-width="2" stroke-dasharray="4 3"/>`;
  } else if(d.type==='zone') {
   const zc = ST.zoneColor||'#378ADD';
   hl.innerHTML = `<rect x="${d.w<0?d.x+d.w:d.x}" y="${d.h<0?d.y+d.h:d.y}" width="${Math.abs(d.w)}" height="${Math.abs(d.h)}" fill="${zc}" fill-opacity="0.1" stroke="${zc}" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6 4" rx="8"/>`;
  } else if(d.type==='pencil') {
   hl.innerHTML = `<polyline points="${d.points.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="2"/>`;
  } else if(d.type==='curve') {
   hl.innerHTML = `<path d="M${d.x1},${d.y1} Q${d.cx},${d.cy} ${d.x2},${d.y2}" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="2" stroke-dasharray="4 3"/>`;
  }
 },

 // ── ELEMENTS ──

 buildElSvg(el) {
  const sel = ST.selected.includes(el);
  const selStroke = sel ? `<circle cx="0" cy="0" r="${(el.size||15)+6}" fill="none" stroke="${el.color||'#2563eb'}" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6"/>` : '';
  // 3D perspective scale: elements higher up (smaller Y) are farther away
  const is3D = ST.viewMode==='3d'||ST.viewMode==='2.5d';
  const yPos = el.y || el.y1 || 400;
  // Scale from 0.55 (top, y=0) to 1.2 (bottom, y=800)
  const depthScale = is3D ? 0.55 + (yPos / 800) * 0.65 : 1;
  const depthOpacity = is3D ? 0.6 + (yPos / 800) * 0.4 : 1;
  switch(el.type) {
   case 'playerA': case 'playerB': case 'goalkeeper': {
    const r = el.size||15;
    const c = el.color;
    const lbl = el.label||'';
    const nm = el.name||'';
    const ds = depthScale;

    if(is3D) {
     // 3D mode: elements stand upright with counter-rotation
     const s = ds * 1.1;
     const shadowRx = 14*s, shadowRy = 5*s;
     const bodyH = ST.avatarMode==='avatar' ? 48*s : ST.avatarMode==='jersey' ? 36*s : 0;

     // Shadow on the ground
     const shadow = `<ellipse cx="0" cy="0" rx="${shadowRx}" ry="${shadowRy}" fill="rgba(0,0,0,0.25)" filter="url(#blur3d)"/>`;

     if(ST.avatarMode==='avatar') {
      return this.buildAvatar3D(el, c, lbl, nm, s, shadow);

     } else if(ST.avatarMode==='jersey') {
      const js = 1.3*s;
      const photoHead3d = el.photo ? `<defs><clipPath id="jc3d${el.id}"><circle cx="0" cy="${-22*js}" r="${6*js}"/></clipPath></defs><image href="${el.photo}" x="${-6*js}" y="${-28*js}" width="${12*js}" height="${12*js}" clip-path="url(#jc3d${el.id})" preserveAspectRatio="xMidYMid slice"/><circle cx="0" cy="${-22*js}" r="${6*js}" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>` : '';
      return `<g transform="translate(${el.x},${el.y})" data-id="${el.id}" style="cursor:grab">${shadow}<g transform="translate(0,${-18*js})">
       <path d="M${-10*js},${-14*js} L${-6*js},${-18*js} L0,${-16*js} L${6*js},${-18*js} L${10*js},${-14*js} L${12*js},${-6*js} L${8*js},${-4*js} L${8*js},${12*js} L${-8*js},${12*js} L${-8*js},${-4*js} L${-12*js},${-6*js} Z" fill="${c}" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
       <path d="M0,${-16*js} L${6*js},${-18*js} L${10*js},${-14*js} L${12*js},${-6*js} L${8*js},${-4*js} L${8*js},${12*js} L0,${12*js} Z" fill="rgba(0,0,0,0.08)"/>
       <text x="0" y="${2*js}" text-anchor="middle" font-size="${12*js}" fill="${this.contrastColor(c)}" font-weight="800">${lbl}</text>
       ${photoHead3d}
      </g>${nm?`<text x="0" y="${-40*js}" text-anchor="middle" font-size="11" fill="${c}" font-weight="800" stroke="#fff" stroke-width="3" paint-order="stroke">${nm}</text>`:''} ${el.position?`<text x="0" y="${18*js}" text-anchor="middle" font-size="9" fill="${c}" font-weight="700" stroke="#fff" stroke-width="2" paint-order="stroke">${el.position}</text>`:''}</g>`;

     } else {

      return `<g transform="translate(${el.x},${el.y})" data-id="${el.id}" style="cursor:grab">
       <ellipse cx="0" cy="${R*0.85}" rx="${R*0.6}" ry="${R*0.15}" fill="rgba(0,0,0,0.18)"/>
       ${body}${head}${accessory}
       ${nm?`<text x="0" y="${-R-4}" text-anchor="middle" font-size="8" fill="${c}" font-weight="700">${nm}</text>`:''}
       <text x="0" y="${R+12}" text-anchor="middle" font-size="6.5" fill="${c}" font-weight="700">${lbl}</text>
      </g>`;
     }
     return `<g transform="translate(${el.x},${el.y})" data-id="${el.id}" style="cursor:grab">
      <circle cx="0" cy="0" r="${r}" fill="${c}" opacity="0.15" stroke="${c}" stroke-width="2"/>
      <circle cx="0" cy="0" r="${r*0.7}" fill="${c}"/>
      <text x="0" y="0" dy="0.35em" text-anchor="middle" font-size="${r*0.7}" fill="${cc}" font-weight="800">${abbr}</text>
      ${nm?`<text x="0" y="${-r-4}" text-anchor="middle" font-size="8" fill="${c}" font-weight="700">${nm}</text>`:''}
      <text x="0" y="${r+8}" text-anchor="middle" font-size="6.5" fill="${c}" font-weight="600">${lbl}</text>
     </g>`;
    }
    if (el.type.startsWith('gm_') || el.type.startsWith('sp_')) {
     const es = el.size||1; const c = el.color||'#64748b'; const rot = el.rotation||0;
     const tool = TOOLS.find(t => t.id === el.type);
     const lbl = tool ? tool.label : el.type.replace('gm_','').replace(/_/g,' ');
     const iconSvg = tool ? tool.icon : '<rect x="3" y="3" width="12" height="12" rx="2" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1"/>';
     const isDark = ST.theme==='dark';
     const labelBg = isDark ? 'rgba(10,15,31,0.85)' : 'rgba(255,255,255,0.92)';
     const lblLen = lbl.length;
     const lblW = Math.max(28, lblLen * 4.6);
     return `<g transform="translate(${el.x},${el.y}) scale(${es})${rot?` rotate(${rot})`:''}" data-id="${el.id}" style="cursor:grab">
      <rect x="-20" y="-18" width="40" height="36" rx="9" fill="${c}" fill-opacity="0.18"/>
      <svg viewBox="0 0 18 18" x="-11" y="-14" width="22" height="22" fill="none" stroke="${c}" style="color:${c}">${iconSvg}</svg>
      <rect x="${-lblW/2}" y="20" width="${lblW}" height="11" rx="3" fill="${labelBg}" opacity="0.95"/>
      <text x="0" y="28.5" text-anchor="middle" font-size="7.5" fill="${c}" font-weight="800" letter-spacing="0.02em">${lbl}</text>
     </g>`;
    }
    return '';
   }
  }
 },

 renderElements() {
  const layer = document.getElementById('elements-layer');
  const mStroke = ST.theme==='dark' ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.7)';
  let defs = `<defs>
   <marker id="arrow-marker" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="${mStroke}" stroke-width="1.5" stroke-linecap="round"/></marker>
   <marker id="pass-tip" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M1,2 L13,7 L1,12 L4,7 Z" fill="#3b82f6" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></marker>
   <filter id="blur3d"><feGaussianBlur stdDeviation="3"/></filter>
   <filter id="shadow3d"><feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.2"/></filter>
  </defs>`;

  // Render permanent trajectories (heatmap scanlines from previous playbacks)
  let trajSvg = '';
  if (ST.trajectories && ST.trajectories.length) {
   ST.trajectories.forEach(traj => {
    if (!traj.points || traj.points.length < 2) return;
    const c = traj.color || '#06b6d4';
    const pathD = 'M' + traj.points.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L');
    // Heatmap-style: wide glow + solid + dashed scanline on top
    trajSvg += `<g class="permanent-traj" data-traj-id="${traj.id}">`;
    trajSvg += `<path d="${pathD}" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.10"/>`;
    trajSvg += `<path d="${pathD}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.22"/>`;
    trajSvg += `<path d="${pathD}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" stroke-dasharray="4 3"/>`;
    // Start dot (origin)
    const p0 = traj.points[0];
    trajSvg += `<circle cx="${p0.x}" cy="${p0.y}" r="4" fill="${c}" opacity="0.5"/>`;
    // End dot (target)
    const pE = traj.points[traj.points.length - 1];
    trajSvg += `<circle cx="${pE.x}" cy="${pE.y}" r="5" fill="${c}" opacity="0.7"/><circle cx="${pE.x}" cy="${pE.y}" r="8" fill="none" stroke="${c}" stroke-width="1.5" opacity="0.5"/>`;
    trajSvg += `</g>`;
   });
  }

  if(ST.viewMode==='3d') {
   const projected = ST.elements.map(el => {
    const ey = el.y||el.y1||400;
    const ex = el.x||el.x1||300;
    const ip = this.toIso(ex, ey, 0);
    return {el, isoY: ip.y};
   });
   projected.sort((a,b) => a.isoY - b.isoY);
   layer.innerHTML = defs + trajSvg + projected.map(({el}) => this.buildIsoElement(el)).join('');
  } else {
   const zOrder = {zone:0, line:1, arrow:1, curve:1, pencil:1, cone:2, disc:2, flag:2, hurdle:2, minigoal:2, mannequin:2, vest:2, ring:2, ladder:2, pole:2, plyobox:2, kettlebell:2, medball:2, trx:2, sled:2, parachute:2, rope:2, battlerope:2, roller:2, band:2, bosu:2, mat:2, ball:2, playerA:3, playerB:3, goalkeeper:3, text:4};
   const sorted = [...ST.elements].sort((a,b)=>(zOrder[a.type]||2)-(zOrder[b.type]||2));
   layer.innerHTML = defs + trajSvg + sorted.map(el => this.buildElSvg(el)).join('');
  }
  // Redibuja medidas y actualiza panel para Bochas/Petanca
  try { this.renderMeasureLines && this.renderMeasureLines(); this.updateMeasureList && this.updateMeasureList(); } catch(e){}
 },

 clearTrajectories() {
  ST.trajectories = [];
  this.renderElements();
 },

 // ── ZOOM ──
 applyZoom() {
  const g = document.getElementById('zoom-group');
  let t = `translate(${ST.panX},${ST.panY}) scale(${ST.zoom})`;
  if(ST.fieldRotation) t += ` rotate(${ST.fieldRotation} 300 400)`;
  if(ST.fieldFlipH) t += ' translate(600,0) scale(-1,1)';
  if(ST.fieldFlipV) t += ' translate(0,800) scale(1,-1)';
  g.setAttribute('transform', t);
 },
 zoomIn() { ST.zoom = Math.min(4, ST.zoom + 0.2); this.applyZoom(); },
 zoomOut() { ST.zoom = Math.max(0.3, ST.zoom - 0.2); this.applyZoom(); },
 zoomReset() { ST.zoom = 1; ST.panX = 0; ST.panY = 0; this.applyZoom(); },

 // ── GRID ──
 toggleGrid() {
  ST.grid = !ST.grid;
  document.getElementById('btn-grid').classList.toggle('active', ST.grid);
  const gl = document.getElementById('grid-layer');
  if(ST.grid) {
   let lines = '';
   for(let x=0;x<=600;x+=20) lines += `<line x1="${x}" y1="0" x2="${x}" y2="800" class="grid-line"/>`;
   for(let y=0;y<=800;y+=20) lines += `<line x1="0" y1="${y}" x2="600" y2="${y}" class="grid-line"/>`;
   gl.innerHTML = lines;
  } else gl.innerHTML = '';
 },

 // ── HISTORY ──
 saveHistory() {
  const snap = JSON.stringify(ST.elements);
  ST.history = ST.history.slice(0, ST.historyIdx + 1);
  ST.history.push(snap);
  if(ST.history.length > ST.maxHistory) ST.history.shift();
  ST.historyIdx = ST.history.length - 1;
 },
 undo() {
  if(ST.historyIdx <= 0) return;
  ST.historyIdx--;
  ST.elements = JSON.parse(ST.history[ST.historyIdx]);
  ST.selected = [];
  this.renderElements(); this.updatePanel(); this.updateStats();
 },
 redo() {
  if(ST.historyIdx >= ST.history.length - 1) return;
  ST.historyIdx++;
  ST.elements = JSON.parse(ST.history[ST.historyIdx]);
  ST.selected = [];
  this.renderElements(); this.updatePanel(); this.updateStats();
 },

 clearAll() {
  if(!confirm('Limpiar todos los elementos?')) return;
  ST.elements = []; ST.selected = [];
  this.saveHistory(); this.renderElements(); this.updatePanel(); this.updateStats();
 },

    bTypes.forEach(bt => {

 setProp(id, key, val) {
  const el = ST.elements.find(x=>x.id===id);
  if(el) { el[key] = val; this.saveHistory(); this.renderElements(); }
 },

 selectEl(id) {
  const el = ST.elements.find(x=>x.id===id);
  if(el) { ST.selected = [el]; this.updatePanel(); this.renderElements(); }
 },

 deleteEl(id) {
  ST.elements = ST.elements.filter(x=>x.id!==id);
  ST.selected = ST.selected.filter(x=>x.id!==id);
  this.saveHistory(); this.renderElements(); this.updatePanel(); this.updateStats();
 },

 deleteSelected() {
  const ids = new Set(ST.selected.map(s=>s.id));
  ST.elements = ST.elements.filter(x=>!ids.has(x.id));
  ST.selected = [];
  this.saveHistory(); this.renderElements(); this.updatePanel(); this.updateStats();
 },

 updateStats() {
  const a = ST.elements.filter(e=>e.type==='playerA').length;
  const b = ST.elements.filter(e=>e.type==='playerB').length;
  const gk = ST.elements.filter(e=>e.type==='goalkeeper').length;
  const arr = ST.elements.filter(e=>e.type==='arrow').length;
  const parts = [];
  if(a) parts.push(`${a} Eq.A`);
  if(b) parts.push(`${b} Eq.B`);
  if(gk) parts.push(`${gk} GK`);
  if(arr) parts.push(`${arr} Flechas`);
  const rest = ST.elements.length - a - b - gk - arr;
  if(rest>0) parts.push(`${rest} otros`);
  document.getElementById('footer-stats').textContent = parts.join(' · ') || '0 elementos';
 },

 // ── KEYBOARD ──
 bindKeys() {
  document.addEventListener('keydown', e => {
   if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
   if(e.key===' ') { ST.spaceDown=true; e.preventDefault(); }
   if(e.ctrlKey||e.metaKey) {
    if(e.key==='z') { e.preventDefault(); this.undo(); }
    if(e.key==='y') { e.preventDefault(); this.redo(); }
    if(e.key==='a') { e.preventDefault(); ST.selected=[...ST.elements]; this.renderElements(); this.updatePanel(); }
    if(e.key==='d') { e.preventDefault(); this.duplicateSelected(); }
    if(e.key==='s') { e.preventDefault(); this.exportPNG(); }
   }
   if(e.key==='Delete'||e.key==='Backspace') { this.deleteSelected(); }
   if(e.key==='Escape') { ST.selected=[]; ST.drawing=null; this.renderElements(); this.updatePanel(); document.getElementById('handles-layer').innerHTML=''; }
   if(e.key==='+'||e.key==='=') this.zoomIn();
   if(e.key==='-') this.zoomOut();
   if(e.key==='0') this.zoomReset();
   if(e.key==='2') this.setView('2d');
   if(e.key==='3') this.setView('2.5d');
   if(e.key==='4') this.setView('3d');
   if(e.key==='r'||e.key==='R') this.rotateField(90);
   if(e.key==='m'||e.key==='M') this.flipField('h');
   if(e.key==='f'||e.key==='F') this.zoomReset();
   if(e.key==='h'||e.key==='H') { document.getElementById('panel').style.display = document.getElementById('panel').style.display==='none'?'flex':'none'; }
   if(e.key==='p'||e.key==='P') this.startPlayback();
   if(e.key==='ArrowRight' && ST.playbackState) { e.preventDefault(); this.playback('stepForward'); }
   if(e.key==='ArrowLeft' && ST.playbackState) { e.preventDefault(); this.playback('stepBack'); }
   if((e.key==='F'||e.key==='f') && (e.shiftKey)) { e.preventDefault(); this.togglePresentation(); }
   if(e.key==='Escape' && document.body.classList.contains('presentation-mode')) { e.preventDefault(); this.togglePresentation(); }
   if(e.key==='Tab') { e.preventDefault(); const modes=['tactical','jersey','avatar']; const i=(modes.indexOf(ST.avatarMode)+1)%3; this.setAvatarMode(modes[i]); }
  });
  document.addEventListener('keyup', e => {
   if(e.key===' ') ST.spaceDown=false;
  });
 },


 bindJoystick() {
  const pad = document.getElementById('joy-pad');
  const thumb = document.getElementById('joy-thumb');
  if(!pad||!thumb) return;
  let dragging = false;
  const onMove = (e) => {
   if(!dragging) return;
   const r = pad.getBoundingClientRect();
   const cx = r.left+r.width/2, cy = r.top+r.height/2;
   let dx = (e.clientX-cx)/(r.width/2), dy = (e.clientY-cy)/(r.height/2);
   const dist = Math.sqrt(dx*dx+dy*dy);
   if(dist>1){dx/=dist;dy/=dist;}
   thumb.style.left = (50+dx*35)+'%';
   thumb.style.top = (50+dy*35)+'%';
   ST.isoAz = 45 + dx*40;
   ST.isoEl = 35 - dy*25;
   ST.isoEl = Math.max(10,Math.min(80,ST.isoEl));
   this.render3DField();
   this.renderElements();
  };
  thumb.addEventListener('mousedown',()=>{dragging=true;document.addEventListener('mousemove',onMove);});
  document.addEventListener('mouseup',()=>{
   if(!dragging) return;
   dragging=false;
   document.removeEventListener('mousemove',onMove);
   thumb.style.left='50%';thumb.style.top='50%';
  });
 },

 duplicateSelected() {
  const newEls = ST.selected.map(el => {
   const ne = {...el, id: ST.nextId++, x: (el.x||0)+20, y: (el.y||0)+20};
   if(ne.x1!==undefined) { ne.x1+=20; ne.y1+=20; ne.x2+=20; ne.y2+=20; }
   if(ne.points) ne.points = ne.points.map(p=>({x:p.x+20,y:p.y+20}));
   return ne;
  });
  ST.elements.push(...newEls);
  ST.selected = newEls;
  this.saveHistory(); this.renderElements(); this.updatePanel(); this.updateStats();
 },

 placeDisposition(type) {
  document.getElementById('modal-overlay').classList.remove('show');
  const count = parseInt(document.getElementById('disp-count').value)||6;
  const isB = document.getElementById('disp-teamB').classList.contains('active');
  const elType = isB ? 'playerB' : 'playerA';
  const cx=400, cy=300;
  let positions = [];

  if(type==='d_row') {
   const spacing = 600/count;
   for(let i=0;i<count;i++) positions.push({x: 100 + spacing*i + spacing/2, y: cy});
  } else if(type==='d_circle') {
   const r = Math.min(180, 30*count/Math.PI);
   for(let i=0;i<count;i++) { const a = (2*Math.PI*i/count) - Math.PI/2; positions.push({x: cx+r*Math.cos(a), y: cy+r*Math.sin(a)}); }
  } else if(type==='d_grid') {
   const cols = Math.ceil(Math.sqrt(count));
   const rows = Math.ceil(count/cols);
   let idx=0;
   for(let r=0;r<rows&&idx<count;r++) for(let c=0;c<cols&&idx<count;c++,idx++) {
    positions.push({x: cx - (cols-1)*35 + c*70, y: cy - (rows-1)*35 + r*70});
   }
  } else if(type==='d_pairs') {
   const pairs = Math.ceil(count/2);
   for(let i=0;i<pairs;i++) {
    const y = 120 + i*(460/pairs);
    positions.push({x: cx-60, y}); if(positions.length<count) positions.push({x: cx+60, y});
   }
  } else if(type==='d_diamond') {
   positions = [{x:cx,y:cy-120},{x:cx+120,y:cy},{x:cx,y:cy+120},{x:cx-120,y:cy}];
   while(positions.length<count) positions.push({x:cx+Math.random()*100-50, y:cy+Math.random()*100-50});
  } else if(type==='d_triangle') {
   positions = [{x:cx,y:cy-120},{x:cx-100,y:cy+80},{x:cx+100,y:cy+80}];
   while(positions.length<count) positions.push({x:cx+Math.random()*80-40, y:cy+Math.random()*80-40});
  }

  positions.slice(0,count).forEach((pos,i) => {
   setTimeout(()=>{
    this.addElement(elType, pos.x, pos.y);
   }, i*50);
  });
 },

 async _captureThumbnail() {
  try {
   const svg = document.getElementById('svg-canvas');
   if (!svg) return null;
   const clone = svg.cloneNode(true);
   // Remove overlay handles/guides from the thumbnail
   ['handles-layer','sel-rect-layer','guides-layer'].forEach(id => { const n = clone.querySelector('#'+id); if (n) n.innerHTML=''; });
   const zg = clone.querySelector('#zoom-group'); if (zg) zg.setAttribute('transform','translate(0,0) scale(1)');
   // Serialize and rasterize via Image
   const xml = new XMLSerializer().serializeToString(clone);
   const svg64 = btoa(unescape(encodeURIComponent(xml)));
   const img64 = 'data:image/svg+xml;base64,' + svg64;
   return await new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
     const W = 1200, H = 630;
     const canvas = document.createElement('canvas');
     canvas.width = W; canvas.height = H;
     const ctx = canvas.getContext('2d');
     // Background
     ctx.fillStyle = ST.theme === 'dark' ? '#1f4a34' : '#f1f5f9';
     ctx.fillRect(0, 0, W, H);
     // Fit the SVG (600x800) into landscape 1200x630
     const aspectSvg = 600 / 800; // w/h
     const aspectBox = W / H;
     let dw, dh;
     if (aspectSvg > aspectBox) { dw = W * 0.72; dh = dw / aspectSvg; }
     else { dh = H * 0.86; dw = dh * aspectSvg; }
     ctx.drawImage(img, (W-dw)/2, (H-dh)/2, dw, dh);
     // Branding
     ctx.fillStyle = '#c8f700';
     ctx.font = 'bold 36px system-ui, Arial';
     ctx.fillText('iTRAIN', 40, H - 40);
     ctx.fillStyle = 'rgba(255,255,255,0.78)';
     ctx.font = '20px system-ui, Arial';
     ctx.fillText((ST.sport || '').toUpperCase() + ' · Pizarra táctica', 150, H - 40);
     resolve(canvas.toDataURL('image/png', 0.88));
    };
    img.onerror = () => resolve(null);
    img.src = img64;
    setTimeout(() => resolve(null), 3500);
   });
  } catch(e) { console.warn('thumb capture failed', e); return null; }
 },

 loadSharedBoard() {
  try {
   // Check ?s= query first (server-backed share)
   const params = new URLSearchParams(window.location.search);
   const sid = params.get('s');
   if (sid) {
    ST.readonly = params.get('readonly') === '1' || true; // default readonly on shared
    const apiUrl = window.location.origin + '/api/boards/view/' + encodeURIComponent(sid);
    // Fetch async — don't block init. Apply once resolved.
    fetch(apiUrl).then(r => r.json()).then(data => {
     if (!data || !data.payload) return;
     this._applySharedPayload(data.payload);
     // Mostrar contador de vistas (social proof)
     if (typeof data.views === 'number') {
      const vc = document.getElementById('viewer-views');
      const vn = document.getElementById('viewer-views-count');
      if (vc && vn) {
       vc.style.display = 'flex';
       vn.textContent = data.views;
       if (data.views < 2) vc.lastElementChild.textContent = 'entrenador';
      }
     }
     // 🔥 Jugada popular badge (si ≥ 3 duplicados)
     if (typeof data.duplicates === 'number' && data.duplicates >= 3) {
      const pop = document.getElementById('viewer-popular');
      const popCnt = document.getElementById('viewer-popular-count');
      if (pop && popCnt) {
       pop.style.display = 'flex';
       popCnt.textContent = data.duplicates;
      }
     }
     this._toast('📋 Pizarra compartida cargada (vista previa)');
    }).catch(err => { console.error('loadSharedBoard fetch err', err); });
    return true;
   }
   // Fallback: hash payload #b=...
   const hash = window.location.hash || '';
   const m = hash.match(/b=([A-Za-z0-9\-_]+)/);
   if (!m) return false;
   const b64 = m[1].replace(/-/g,'+').replace(/_/g,'/');
   const pad = '='.repeat((4 - b64.length % 4) % 4);
   const json = decodeURIComponent(escape(atob(b64 + pad)));
   this._applySharedPayload(JSON.parse(json));
   return true;
  } catch(e) { console.error('loadSharedBoard error', e); return false; }
 },

 _applySharedPayload(payload) {
  if (!payload) return;
  if (payload.sport) ST.sport = payload.sport;
  if (payload.variant) ST.variant = payload.variant;
  if (payload.avatarMode) ST.avatarMode = payload.avatarMode;
  if (payload.avatarStyle) ST.avatarStyle = payload.avatarStyle;
  if (payload.avatarGender) ST.avatarGender = payload.avatarGender;
  if (payload.viewMode) ST.viewMode = payload.viewMode;
  if (payload.teamA) ST.teamAColor = payload.teamA;
  if (payload.teamB) ST.teamBColor = payload.teamB;
  if (Array.isArray(payload.elements)) ST.elements = payload.elements;
  // Update viewer title
  const vt = document.getElementById('viewer-title');
  if (vt) vt.textContent = `Jugada táctica · ${ST.sport || ''}`;
  // Re-render
  try {
   if (ST.viewMode === '3d') this.render3DField(); else this.renderFieldOnly();
   this.renderElements();
   this.updatePanel && this.updatePanel();
   this.updateStats && this.updateStats();
   this.updateScoreboard && this.updateScoreboard();
   this.updateVariantSelector && this.updateVariantSelector();
  } catch(e){}
 },


 exportPNG() {
  const svg = document.getElementById('svg-canvas');
  const clone = svg.cloneNode(true);
  const zg = clone.getElementById('zoom-group');
  if(zg) zg.setAttribute('transform','translate(0,0) scale(1)');
  const hl = clone.getElementById('handles-layer'); if(hl) hl.innerHTML='';
  const sl = clone.getElementById('sel-rect-layer'); if(sl) sl.innerHTML='';
  const gl = clone.getElementById('guides-layer'); if(gl) gl.innerHTML='';
  clone.querySelectorAll('span').forEach(s=>{while(s.firstChild)s.parentNode.insertBefore(s.firstChild,s);s.remove()});

  // Adjust viewBox based on view mode
  let vbX=0, vbY=0, vbW=600, vbH=800;
  if(ST.viewMode==='3d') {
   // Calculate isometric bounds from field corners + margin
   const corners = [[0,0],[600,0],[0,800],[600,800]];
   let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
   corners.forEach(([x,y])=>{
    const p=this.toIso(x,y,0);
    minX=Math.min(minX,p.x); minY=Math.min(minY,p.y);
    maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y);
   });
   // Add margin for elements and 3D objects (goals, nets extend beyond field)
   const margin = 60;
   vbX = minX - margin; vbY = minY - margin;
   vbW = maxX - minX + margin*2; vbH = maxY - minY + margin*2;
  }
  clone.setAttribute('viewBox', `${vbX} ${vbY} ${vbW} ${vbH}`);

  // Canvas size matches viewBox aspect ratio at 2x resolution
  const scale = 2;
  const cw = Math.round(vbW * scale);
  const ch = Math.round(vbH * scale);

  const data = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([data],{type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = ()=>{
   const c = document.createElement('canvas');
   c.width = cw; c.height = ch;
   const ctx = c.getContext('2d');
   ctx.fillStyle='#ffffff';
   ctx.fillRect(0,0,cw,ch);
   ctx.drawImage(img,0,0,cw,ch);
   URL.revokeObjectURL(url);
   const a = document.createElement('a');
   a.download=`pizarra_${ST.sport.replace(/\s+/g,'_')}_${new Date().toISOString().split('T')[0]}.png`;
   a.href=c.toDataURL('image/png');
   a.click();
  };
  img.src = url;
 },

 // ── PLAYBACK ENGINE (moves real players along arrows) ──
 startPlayback() {
  const arrows = ST.elements.filter(e => e.type === 'arrow');
  if (!arrows.length) {
   alert('No hay flechas en la pizarra. Dibuja flechas cerca de los jugadores o el balón para crear movimientos.');
   return;
  }
  arrows.sort((a, b) => (a.playOrder || 0) - (b.playOrder || 0));
  
  const ANIMATABLE_TYPES = new Set(['playerA','playerB','goalkeeper','ball','cone','disc','flag','kettlebell','medball','pilatesball']);
  const isAnimatable = (t) => ANIMATABLE_TYPES.has(t);
  
  ST.playbackOriginalPos = {};
  ST.elements.forEach(el => {
   if (isAnimatable(el.type)) {
    ST.playbackOriginalPos[el.id] = { x: el.x, y: el.y };
   }
  });
  
  // PASE 1: Asignar cada flecha a su actor más cercano
  const arrowActors = new Map();
  arrows.forEach(ar => {
   // Si es flecha "Pase/Tiro" explícita → asociar SIEMPRE al balón más cercano (sin umbral)
   if (ar.isBallArrow) {
    let ball = null, minD = Infinity;
    ST.elements.forEach(el => {
     if (el.type !== 'ball') return;
     const d = Math.hypot(el.x - ar.x1, el.y - ar.y1);
     if (d < minD) { minD = d; ball = el; }
    });
    if (ball) { arrowActors.set(ar.id, ball); return; }
   }
   const player = this.findNearestPlayerForPlayback(ar.x1, ar.y1, null);
   const obj = this.findNearestObjectForPlayback(ar.x1, ar.y1, null);
   const pDist = player ? Math.hypot(player.x - ar.x1, player.y - ar.y1) : Infinity;
   const oDist = obj ? Math.hypot(obj.x - ar.x1, obj.y - ar.y1) : Infinity;
   let chosen = null;
   if (obj && oDist < 40 && oDist < pDist) chosen = obj;
   else if (player && pDist < 200) chosen = player;
   else if (obj && oDist < 120) chosen = obj;
   arrowActors.set(ar.id, chosen);
  });
  
  // PASE 2: Construir cadenas SOLO entre flechas con el MISMO actor
  const CHAIN_DIST = 80;
  const usedArrowIds = new Set();
  const chains = [];
  
  arrows.forEach(arrow => {
   if (usedArrowIds.has(arrow.id)) return;
   const chain = [arrow];
   usedArrowIds.add(arrow.id);
   const chainActor = arrowActors.get(arrow.id);
   let searching = true;
   while (searching) {
    searching = false;
    const lastSeg = chain[chain.length - 1];
    const endX = lastSeg.x2, endY = lastSeg.y2;
    for (const next of arrows) {
     if (usedArrowIds.has(next.id)) continue;
     // Solo encadenar si la siguiente flecha pertenece al mismo actor
     if (arrowActors.get(next.id) !== chainActor) continue;
     const dx = next.x1 - endX, dy = next.y1 - endY;
     if (Math.sqrt(dx * dx + dy * dy) < CHAIN_DIST) {
      chain.push(next);
      usedArrowIds.add(next.id);
      searching = true;
      break;
     }
    }
   }
   chains.push({ arrows: chain, actor: chainActor });
  });
  
  // PASE 3: Convertir a formato playbackChains
  ST.playbackChains = [];
  const usedElems = new Set();
  let matched = 0;
  
  chains.forEach(({arrows: chainArrows, actor}) => {
   const segments = chainArrows.map(a => ({
    arrow: a, fromX: a.x1, fromY: a.y1, toX: a.x2, toY: a.y2, cx: a.cx, cy: a.cy
   }));
   // Actor puede estar ya usado por otra cadena; no importa, cada cadena anima su actor asignado
   if (actor && !usedElems.has(actor.id)) {
    usedElems.add(actor.id);
    matched++;
    ST.playbackChains.push({ playerId: actor.id, followerType: actor.type, segments });
   } else if (actor) {
    // Actor duplicado: reusa el mismo actor (ej: balón que hace dos pases)
    matched++;
    ST.playbackChains.push({ playerId: actor.id, followerType: actor.type, segments });
   } else {
    ST.playbackChains.push({ playerId: null, segments });
   }
  });
  
  if (!matched) {
   alert('No se encontraron jugadores, balones u objetos cerca de las flechas. Coloca un elemento cerca del inicio de cada flecha.');
   ST.playbackOriginalPos = null;
   return;
  }
  
  ST.playbackMaxSegs = Math.max(...ST.playbackChains.map(c => c.segments.length));
  ST.playbackAllSegments = ST.playbackChains.reduce((arr, c) => arr.concat(c.segments), []);
  
  ST.playbackSpeed = ST.playbackSpeed || 1;
  ST.playbackState = 'playing';
  ST.playbackProgress = 0;
  ST.playbackStartTime = null;
  ST.playbackTrails = {};
  document.getElementById('playback-bar').classList.add('show');
  document.getElementById('pb-play').classList.add('playing');
  document.getElementById('pb-pause').classList.remove('playing');
  this.renderPlaybackFrame();
 },

 findNearestPlayerForPlayback(x, y, excludeSet) {
  let nearest = null, minDist = 200;
  ST.elements.forEach(el => {
   if (el.type !== 'playerA' && el.type !== 'playerB' && el.type !== 'goalkeeper') return;
   if (excludeSet && excludeSet.has(el.id)) return;
   const dx = el.x - x, dy = el.y - y;
   const dist = Math.sqrt(dx * dx + dy * dy);
   if (dist < minDist) { minDist = dist; nearest = el; }
  });
  return nearest;
 },

 findNearestObjectForPlayback(x, y, excludeSet) {
  const OBJECT_TYPES = new Set(['ball','cone','disc','flag','kettlebell','medball','pilatesball']);
  let nearest = null, minDist = 120;
  ST.elements.forEach(el => {
   if (!OBJECT_TYPES.has(el.type)) return;
   if (excludeSet && excludeSet.has(el.id)) return;
   const dx = el.x - x, dy = el.y - y;
   const dist = Math.sqrt(dx * dx + dy * dy);
   if (dist < minDist) { minDist = dist; nearest = el; }
  });
  return nearest;
 },

 playback(action) {
  if (action === 'stepForward' || action === 'stepBack') {
   const chains = ST.playbackChains;
   if (!chains || !chains.length) { this.startPlayback(); }
   if (!ST.playbackChains || !ST.playbackChains.length) return;
   // Pause
   if (ST.playbackRAF) cancelAnimationFrame(ST.playbackRAF);
   ST.playbackState = 'paused';
   document.getElementById('pb-play').classList.remove('playing');
   document.getElementById('pb-pause').classList.add('playing');
   // Compute current progress
   const maxSegs = ST.playbackMaxSegs || 1;
   const stepPct = 1 / maxSegs;
   let p = (ST.playbackProgress || 0) + (action === 'stepForward' ? stepPct : -stepPct);
   p = Math.max(0, Math.min(1, p));
   ST.playbackProgress = p;
   ST.playbackPausedProgress = p;
   // Trick: temporalmente cambiar a playing, setear startTime retroactivo, renderizar UN frame
   const STEP_DURATION = 1500 / (ST.playbackSpeed || 1);
   ST.playbackStartTime = performance.now() - p * maxSegs * STEP_DURATION;
   ST.playbackState = 'playing';
   this.renderPlaybackFrame();
   ST.playbackState = 'paused';
   if (ST.playbackRAF) cancelAnimationFrame(ST.playbackRAF);
   return;
  }
  if (action === 'play') {
   if (ST.playbackState === 'paused') {
    ST.playbackState = 'playing';
    ST.playbackStartTime = null;
    document.getElementById('pb-play').classList.add('playing');
    document.getElementById('pb-pause').classList.remove('playing');
    this.renderPlaybackFrame();
   } else if (ST.playbackState === 'stopped' || !ST.playbackState) {
    this.startPlayback();
   }
  } else if (action === 'pause') {
   ST.playbackState = 'paused';
   ST.playbackPausedProgress = ST.playbackProgress || 0;
   document.getElementById('pb-play').classList.remove('playing');
   document.getElementById('pb-pause').classList.add('playing');
   if (ST.playbackRAF) cancelAnimationFrame(ST.playbackRAF);
  } else if (action === 'stop') {
   ST.playbackState = 'stopped';
   if (ST.playbackRAF) cancelAnimationFrame(ST.playbackRAF);
   document.getElementById('playback-bar').classList.remove('show');
   document.getElementById('pb-play').classList.remove('playing');
   document.getElementById('pb-pause').classList.remove('playing');
   if (ST.playbackOriginalPos && ST.playbackChains && ST.playbackChains.length) {
    const keep = confirm('¿Mantener las nuevas posiciones de los jugadores?');
    if (!keep) {
     Object.entries(ST.playbackOriginalPos).forEach(([id, pos]) => {
      const el = ST.elements.find(e => e.id === +id);
      if (el) { el.x = pos.x; el.y = pos.y; }
     });
    } else {
     // Keep at final arrow tip of each chain
     ST.playbackChains.forEach(chain => {
      if (!chain.playerId) return;
      const last = chain.segments[chain.segments.length - 1];
      const el = ST.elements.find(e => e.id === chain.playerId);
      if (el) { el.x = last.toX; el.y = last.toY; }
     });
    }
    // Save ball/object trails as permanent heatmap trajectories
    if (ST.playbackTrails) {
     Object.entries(ST.playbackTrails).forEach(([eid, pts]) => {
      if (!pts || pts.length < 3) return;
      const el = ST.elements.find(e => String(e.id) === String(eid));
      if (!el) return;
      if (el.type !== 'ball') return; // only ball gets permanent heatmap
      ST.trajectories = ST.trajectories || [];
      ST.trajectories.push({
       id: ST.nextId++,
       elementType: el.type,
       points: pts.map(p => ({ x: p.x, y: p.y })),
       color: '#06b6d4',
       timestamp: Date.now()
      });
     });
    }
   }
   ST.playbackOriginalPos = null;
   ST.playbackTrails = null;
   this.renderElements();
  }
 },

 setPlaySpeed(speed) {
  ST.playbackSpeed = speed;
  document.querySelectorAll('.pb-speed').forEach(b => b.classList.remove('active'));
  const btn = speed === 0.5 ? 'pb-s05' : speed === 2 ? 'pb-s2' : 'pb-s1';
  document.getElementById(btn).classList.add('active');
 },

 // Interpolate along a path (line or curve)
 interpolatePath(move, t) {
  t = Math.max(0, Math.min(1, t));
  // Ease in-out for smooth movement
  const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  if (move.cx !== undefined && move.cy !== undefined) {
   // Quadratic bezier
   const u = 1 - ease;
   const x = u * u * move.fromX + 2 * u * ease * move.cx + ease * ease * move.toX;
   const y = u * u * move.fromY + 2 * u * ease * move.cy + ease * ease * move.toY;
   return { x, y };
  }
  // Linear
  return {
   x: move.fromX + (move.toX - move.fromX) * ease,
   y: move.fromY + (move.toY - move.fromY) * ease
  };
 },

 renderPlaybackFrame() {
  if (ST.playbackState !== 'playing') return;
  const chains = ST.playbackChains;
  if (!chains || !chains.length) return;

  const is3D = ST.viewMode === '3d';
  const maxSegs = ST.playbackMaxSegs;
  const STEP_DURATION = 1500 / ST.playbackSpeed;
  const now = performance.now();
  if (!ST.playbackStartTime) {
   ST.playbackStartTime = now;
   if (ST.playbackPausedProgress > 0) {
    ST.playbackStartTime = now - ST.playbackPausedProgress * maxSegs * STEP_DURATION;
    ST.playbackPausedProgress = 0;
   }
  }

  const elapsed = now - ST.playbackStartTime;
  const totalDuration = maxSegs * STEP_DURATION;
  const progress = Math.min(elapsed / totalDuration, 1);
  ST.playbackProgress = progress;

  // stepFloat is a continuous value from 0 to maxSegs
  const stepFloat = progress * maxSegs;
  const currentGlobalStep = Math.min(Math.floor(stepFloat), maxSegs - 1);
  const stepFrac = stepFloat - currentGlobalStep;

  document.getElementById('pb-fill').style.width = (progress * 100) + '%';
  document.getElementById('pb-step').textContent = `Paso ${currentGlobalStep + 1} / ${maxSegs}`;

  // Update player positions: each chain simultaneously
  // Also track ball/object trail positions for ghost effect
  if (!ST.playbackTrails) ST.playbackTrails = {};
  const GHOST_TYPES = new Set(['ball','cone','disc','flag','kettlebell','medball','pilatesball']);
  
  chains.forEach(chain => {
   if (!chain.playerId) return;
   const el = ST.elements.find(e => e.id === chain.playerId);
   if (!el) return;
   const segs = chain.segments;
   const prevX = el.x, prevY = el.y;
   
   if (currentGlobalStep >= segs.length) {
    const last = segs[segs.length - 1];
    el.x = last.toX; el.y = last.toY;
   } else {
    const seg = segs[currentGlobalStep];
    const pos = this.interpolatePath(seg, stepFrac);
    el.x = pos.x; el.y = pos.y;
   }
   
   // Check goal crossing for balls (y para discos de Rana que también anotan)
   if (el.type === 'ball' || (ST.sport === 'Rana' && (el.type === 'rana_disc' || el.type === 'ball_bowling'))) {
    this.checkGoalCrossing(el, prevX, prevY);
   }
   // Check knockdowns (bowling pins, tejo mechas, bolo criollo palos)
   this.checkKnockdowns(el, prevX, prevY);
   
   // Track trail for ghost effect (balls & objects)
   if (GHOST_TYPES.has(el.type)) {
    if (!ST.playbackTrails[el.id]) ST.playbackTrails[el.id] = [];
    const trail = ST.playbackTrails[el.id];
    const last = trail[trail.length - 1];
    // Only push if moved > 8px (avoid dense overlap)
    if (!last || Math.hypot(el.x - last.x, el.y - last.y) > 8) {
     trail.push({ x: el.x, y: el.y, t: elapsed });
     if (trail.length > 18) trail.shift(); // cap trail length
    }
   }
  });

  // Re-render
  const layer = document.getElementById('elements-layer');
  let defs = `<defs>
   <marker id="arrow-marker" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,1.2 L11,5 L0,8.8 L2.6,5 Z" fill="rgba(37,99,235,0.85)"/></marker>
   <marker id="pass-tip" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,1 L11,6 L0,11 L2.8,6 Z" fill="rgba(37,99,235,0.9)"/></marker>
   <marker id="play-arrow" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto"><path d="M0,0.8 L10,4.5 L0,8.2 L2.2,4.5 Z" fill="rgba(37,99,235,0.78)"/></marker>
   <filter id="blur3d"><feGaussianBlur stdDeviation="3"/></filter>
   <filter id="shadow3d"><feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.2"/></filter>
  </defs>`;

  let svgParts = '';

  // Render ghost trails for moving balls & objects (behind the element)
  if (ST.playbackTrails) {
   Object.entries(ST.playbackTrails).forEach(([eid, pts]) => {
    if (!pts || pts.length < 2) return;
    const el = ST.elements.find(e => String(e.id) === String(eid));
    if (!el) return;
    // Motion glow stroke through points
    const c = el.type === 'ball' ? '#06b6d4' : (el.color || '#3b82f6');
    // Build smooth polyline path in current projection
    const projPts = pts.map(p => {
     if (is3D) { const ip = this.toIso(p.x, p.y, 0); return { x: ip.x, y: ip.y }; }
     return { x: p.x, y: p.y };
    });
    const pathD = 'M' + projPts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L');
    // Soft wide glow
    svgParts += `<path d="${pathD}" fill="none" stroke="${c}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.14"/>`;
    svgParts += `<path d="${pathD}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>`;
    svgParts += `<path d="${pathD}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>`;
    // Ghost spheres (fading older positions)
    const n = projPts.length;
    projPts.forEach((p, i) => {
     const age = i / n; // 0 = oldest, 1 = newest
     const r = 2 + age * 3.5;
     const op = 0.1 + age * 0.35;
     svgParts += `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${c}" opacity="${op.toFixed(2)}"/>`;
    });
   });
  }

  // Render all non-arrow elements (players at animated positions)
  const nonArrows = ST.elements.filter(el => el.type !== 'arrow');
  if (is3D) {
   const projected = nonArrows.map(el => {
    const ey = el.y || 400, ex = el.x || 300;
    const ip = this.toIso(ex, ey, 0);
    return { el, isoY: ip.y };
   });
   projected.sort((a, b) => a.isoY - b.isoY);
   projected.forEach(({ el }) => { svgParts += this.buildIsoElement(el); });
  } else {
   const zOrder = {zone:0, line:1, curve:1, pencil:1, cone:2, disc:2, flag:2, hurdle:2, minigoal:2, mannequin:2, vest:2, ring:2, ladder:2, pole:2, ball:2, playerA:3, playerB:3, goalkeeper:3, text:4};
   const sorted = [...nonArrows].sort((a, b) => (zOrder[a.type] || 2) - (zOrder[b.type] || 2));
   sorted.forEach(el => { svgParts += this.buildElSvg(el); });
  }

  // Draw arrow trails per chain
  chains.forEach(chain => {
   chain.segments.forEach((seg, segIdx) => {
    const a = seg.arrow;
    let x1, y1, x2, y2;
    if (is3D) {
     const p1 = this.toIso(a.x1 || 0, a.y1 || 0, 0);
     const p2 = this.toIso(a.x2 || 0, a.y2 || 0, 0);
     x1 = p1.x; y1 = p1.y; x2 = p2.x; y2 = p2.y;
    } else {
     x1 = a.x1; y1 = a.y1; x2 = a.x2; y2 = a.y2;
    }
    const pathD = `M${x1},${y1}L${x2},${y2}`;

    if (segIdx < currentGlobalStep) {
     // Completed segment (rastro muy sutil)
     svgParts += `<path d="${pathD}" fill="none" stroke="rgba(37,99,235,0.32)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4" opacity="0.6"/>`;
    } else if (segIdx === currentGlobalStep && segIdx < chain.segments.length) {
     // Active segment in this chain
     if (chain.playerId) {
      // Ghost full path (muy sutil)
      svgParts += `<path d="${pathD}" fill="none" stroke="rgba(37,99,235,0.1)" stroke-width="1.2" stroke-dasharray="4 4"/>`;
      // Animated partial: línea fina con gradiente y punta elegante
      const rawPos = this.interpolatePath(seg, stepFrac);
      let px, py;
      if (is3D) { const pp = this.toIso(rawPos.x, rawPos.y, 0); px = pp.x; py = pp.y; }
      else { px = rawPos.x; py = rawPos.y; }
      // Trazo visible delgado (1.8px con gradiente fade-in desde el origen)
      const gradId = `pb-grad-${segIdx}-${chain.playerId}`;
      svgParts += `<defs><linearGradient id="${gradId}" x1="${x1}" y1="${y1}" x2="${px}" y2="${py}" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#2563eb" stop-opacity="0.05"/><stop offset="50%" stop-color="#2563eb" stop-opacity="0.5"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0.85"/></linearGradient></defs>`;
      // Línea principal elegante
      svgParts += `<path d="M${x1},${y1}L${px},${py}" fill="none" stroke="url(#${gradId})" stroke-width="1.8" stroke-linecap="round" marker-end="url(#play-arrow)"/>`;
      // Halo sutil detrás (glow)
      svgParts += `<path d="M${x1},${y1}L${px},${py}" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" opacity="0.06"/>`;
     }
     // Step badge
     svgParts += `<circle cx="${x1}" cy="${y1-18}" r="9" fill="rgba(37,99,235,0.85)"/><text x="${x1}" y="${y1-18}" dy="0.35em" text-anchor="middle" font-size="8" fill="#fff" font-weight="700">${a.playOrder||''}</text>`;
    } else {
     // Future segment (muy sutil, solo guía)
     svgParts += `<path d="${pathD}" fill="none" stroke="rgba(148,163,184,0.15)" stroke-width="0.9" stroke-dasharray="3 4"/>`;
    }
   });
  });

  layer.innerHTML = defs + svgParts;

  if (progress >= 1) {
   ST.playbackStartTime = null;
   // Ensure all players at their final chain tips
   chains.forEach(chain => {
    if (!chain.playerId) return;
    const last = chain.segments[chain.segments.length - 1];
    const el = ST.elements.find(e => e.id === chain.playerId);
    if (el) { el.x = last.toX; el.y = last.toY; }
   });
   setTimeout(() => {
    if (ST.playbackState === 'playing') this.playback('stop');
   }, 1200);
   return;
  }
