  <line x1="256" y1="130" x2="256" y2="510" stroke="#CCFF00" stroke-width="2" opacity="0.18"/>
  <line x1="80" y1="312" x2="432" y2="312" stroke="#CCFF00" stroke-width="2" opacity="0.18"/>
  <g transform="translate(256, 320) scale(1.0)" filter="url(#ng)">
    
<!-- WINGS BACKGROUND (drawn first so body overlaps) -->
<!-- Left wing (rear) - large bat wing extending up and out -->
<path d="
  M -10 -20
  C -50 -50, -100 -90, -150 -130
